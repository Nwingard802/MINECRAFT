    left: 50%;
    transform: translateX(-50%);

    gap: 4px;
    padding: 5px;
    background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.3);
    z-index: 20;

</div>

<div id="hotbar"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const RENDER_DISTANCE = 16;

const WORLD_HEIGHT = 24;

const SEA_LEVEL = 4;

const GRAVITY = 25;

const JUMP_POWER = 9;

const MOVE_SPEED = 5;


/*
    Player collision body.

    This is NOT the camera.

    The player is basically:

    width  = 0.6
    height = 1.8
*/

const PLAYER_WIDTH = 0.6;

const PLAYER_HEIGHT = 1.8;


/*
    Where the eyes are inside the body.
*/

const EYE_HEIGHT = 1.62;


/*
    Textures
*/

const TEXTURE_BASE =
    "https://raw.githubusercontent.com/Nwingard802/MINECRAFT/main/IMAGES/";


/* =========================================================
   BLOCKS
========================================================= */

/*
    We only have 9 hotbar slots.

    Water gets slot 9.

    Cobblestone is still supported by the renderer,
    but isn't in the hotbar.
*/

const BLOCKS = [
    "grass",
    "dirt",
    "stone",
    "sand",
    "wood",
    "leaves",
    "brick",
    "cobblestone",
    "water"
];


/*
    Water is not solid.
*/

const NON_SOLID_BLOCKS = new Set([
    "water",
    "leaves"
]);


function isSolidBlock(type) {

    if (!type) {
        return false;
    }

    return !NON_SOLID_BLOCKS.has(type);
}


/* =========================================================
   THREE.JS
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);


scene.fog =
    new THREE.Fog(
        0x87ceeb,
        RENDER_DISTANCE * 0.7,
        RENDER_DISTANCE + 10
    );


const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.05,
        200
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias: false
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
========================================================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.7
    );

scene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

sun.position.set(
    50,
    100,
    50
);

scene.add(
    sun
);


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();

const textures = {};

const materials = {};


function loadTexture(name) {

    const texture =
        textureLoader.load(
            TEXTURE_BASE +
            name +
            ".png"
        );

    texture.magFilter =
        THREE.NearestFilter;

    texture.minFilter =
        THREE.NearestFilter;

    texture.generateMipmaps =
        false;

    texture.colorSpace =
        THREE.SRGBColorSpace;

    textures[name] =
        texture;

    return texture;
}


for (
    const block of BLOCKS
) {

    const texture =
        loadTexture(block);


    if (block === "water") {

        materials[block] =
            new THREE.MeshLambertMaterial({
                map: texture,

                transparent: true,

                opacity: 0.65,

                depthWrite: false,

                side: THREE.DoubleSide
            });

    } else if (block === "leaves") {

        materials[block] =
            new THREE.MeshLambertMaterial({
                map: texture,

                transparent: true,

                opacity: 0.9,

                side: THREE.DoubleSide
            });

    } else {

        materials[block] =
            new THREE.MeshLambertMaterial({
                map: texture
            });
    }
}


/* =========================================================
   WORLD DATA
========================================================= */

const worldBlocks =
    new Map();


const generatedColumns =
    new Set();


const renderedBlocks =
    new Map();


function blockKey(
    x,
    y,
    z
) {

    return `${x},${y},${z}`;
}


function columnKey(
    x,
    z
) {

    return `${x},${z}`;
}


/* =========================================================
   TERRAIN
========================================================= */

function getTerrainHeight(
    x,
    z
) {

    const h =
        6
        + Math.sin(x * 0.18) * 2
        + Math.cos(z * 0.16) * 2
        + Math.sin((x + z) * 0.08) * 2;

    return Math.max(
        2,
        Math.floor(h)
    );
}


/* =========================================================
   TERRAIN GENERATION
========================================================= */

function generateColumn(
    x,
    z
) {

    const cKey =
        columnKey(
            x,
            z
        );


    /*
        IMPORTANT:

        Once a column has been generated,
        we NEVER regenerate it.

        This keeps broken/placed blocks.
    */

    if (
        generatedColumns.has(cKey)
    ) {
        return;
    }


    generatedColumns.add(
        cKey
    );


    const terrainHeight =
        getTerrainHeight(
            x,
            z
        );


    /*
        Ground
    */

    for (
        let y = 0;
        y <= terrainHeight;
        y++
    ) {

        let blockType;


        if (
            y === terrainHeight
        ) {

            /*
                Beach areas become sand.
            */

            if (
                terrainHeight <= SEA_LEVEL + 1
            ) {

                blockType =
                    "sand";

            } else {

                blockType =
                    "grass";
            }

        } else if (
            y >= terrainHeight - 3
        ) {

            blockType =
                terrainHeight <= SEA_LEVEL + 1
                    ? "sand"
                    : "dirt";

        } else {

            blockType =
                "stone";
        }


        worldBlocks.set(
            blockKey(
                x,
                y,
                z
            ),
            blockType
        );
    }


    /*
        WATER

        Fill everything between the terrain
        and sea level.
    */

    if (
        terrainHeight < SEA_LEVEL
    ) {

        for (
            let y = terrainHeight + 1;
            y <= SEA_LEVEL;
            y++
        ) {

            worldBlocks.set(
                blockKey(
                    x,
                    y,
                    z
                ),
                "water"
            );
        }
    }


    /*
        Trees only grow above water.
    */

    if (
        terrainHeight > SEA_LEVEL + 1
    ) {

        const treeChance =
            Math.sin(
                x * 12.9898 +
                z * 78.233
            ) *
            43758.5453;


        const random =
            treeChance -
            Math.floor(
                treeChance
            );


        if (
            random > 0.94
        ) {

            generateTree(
                x,
                terrainHeight + 1,
                z
            );
        }
    }
}


/* =========================================================
   TREES
========================================================= */

function generateTree(
    x,
    y,
    z
) {

    /*
        Trunk
    */

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        worldBlocks.set(
            blockKey(
                x,
                y + i,
                z
            ),
            "wood"
        );
    }


    /*
        Leaves
    */

    for (
        let dx = -2;
        dx <= 2;
        dx++
    ) {

        for (
            let dz = -2;
            dz <= 2;
            dz++
        ) {

            for (
                let dy = 2;
                dy <= 4;
                dy++
            ) {

                if (
                    Math.abs(dx) +
                    Math.abs(dz) +
                    Math.abs(dy - 3)
                    <= 4
                ) {

                    const key =
                        blockKey(
                            x + dx,
                            y + dy,
                            z + dz
                        );


                    if (
                        !worldBlocks.has(
                            key
                        )
                    ) {

                        worldBlocks.set(
                            key,
                            "leaves"
                        );
                    }
                }
            }
        }
    }
}


/* =========================================================
   BLOCK RENDERING
========================================================= */

const cubeGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


function createBlockMesh(
    x,
    y,
    z,
    type
) {

    const mesh =
        new THREE.Mesh(
            cubeGeometry,
            materials[type]
        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.userData.x = x;

    mesh.userData.y = y;

    mesh.userData.z = z;

    mesh.userData.type = type;


    scene.add(
        mesh
    );


    renderedBlocks.set(
        blockKey(
            x,
            y,
            z
        ),
        mesh
    );
}


function removeBlockMesh(
    x,
    y,
    z
) {

    const key =
        blockKey(
            x,
            y,
            z
        );


    const mesh =
        renderedBlocks.get(
            key
        );


    if (!mesh) {
        return;
    }


    scene.remove(
        mesh
    );


    renderedBlocks.delete(
        key
    );
}


function renderBlock(
    x,
    y,
    z
) {

    const key =
        blockKey(
            x,
            y,
            z
        );


    if (
        renderedBlocks.has(key)
    ) {
        return;
    }


    const type =
        worldBlocks.get(
            key
        );


    if (!type) {
        return;
    }


    createBlockMesh(
        x,
        y,
        z,
        type
    );
}


/* =========================================================
   RENDER WORLD
========================================================= */

function renderWorldAroundPlayer() {

    const px =
        Math.floor(
            player.position.x
        );


    const pz =
        Math.floor(
            player.position.z
        );


    /*
        Generate terrain.
    */

    for (
        let x = px - RENDER_DISTANCE;
        x <= px + RENDER_DISTANCE;
        x++
    ) {

        for (
            let z = pz - RENDER_DISTANCE;
            z <= pz + RENDER_DISTANCE;
            z++
        ) {

            generateColumn(
                x,
                z
            );
        }
    }


    /*
        Render terrain.
    */

    for (
        let x = px - RENDER_DISTANCE;
        x <= px + RENDER_DISTANCE;
        x++
    ) {

        for (
            let z = pz - RENDER_DISTANCE;
            z <= pz + RENDER_DISTANCE;
            z++
        ) {

            for (
                let y = 0;
                y < WORLD_HEIGHT;
                y++
            ) {

                renderBlock(
                    x,
                    y,
                    z
                );
            }
        }
    }


    /*
        Remove distant rendered meshes.

        IMPORTANT:

        We do NOT delete worldBlocks.

        So the blocks return when you come back.
    */

    for (
        const [
            key,
            mesh
        ] of renderedBlocks
    ) {

        const dx =
            mesh.position.x -
            player.position.x;


        const dz =
            mesh.position.z -
            player.position.z;


        if (
            Math.abs(dx) >
                RENDER_DISTANCE + 2 ||
            Math.abs(dz) >
                RENDER_DISTANCE + 2
        ) {

            scene.remove(
                mesh
            );

            renderedBlocks.delete(
                key
            );
        }
    }
}


/* =========================================================
   PLAYER
========================================================= */

/*
    position.y = PLAYER'S FEET.

    This is the important change.

    The camera is NOT the collision body.
*/

const player = {

    position:
        new THREE.Vector3(
            0,
            10,
            0
        ),

    velocity:
        new THREE.Vector3(
            0,
            0,
            0
        ),

    onGround: false,

    yaw: 0,

    pitch: 0
};


/* =========================================================
   COLLISION HELPERS
========================================================= */

function getBlockType(
    x,
    y,
    z
) {

    return worldBlocks.get(
        blockKey(
            Math.floor(x),
            Math.floor(y),
            Math.floor(z)
        )
    );
}


function isSolidAt(
    x,
    y,
    z
) {

    const type =
        getBlockType(
            x,
            y,
            z
        );


    return isSolidBlock(
        type
    );
}


/*
    Checks the player's entire
    collision box against blocks.

    x/z = center of player
    y   = player's feet
*/

function collidesAt(
    x,
    y,
    z
) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const minX =
        x - halfWidth;

    const maxX =
        x + halfWidth;


    const minY =
        y;

    const maxY =
        y + PLAYER_HEIGHT;


    const minZ =
        z - halfWidth;

    const maxZ =
        z + halfWidth;


    /*
        Figure out which blocks
        the player could overlap.
    */

    const minBlockX =
        Math.floor(
            minX + 0.5
        );

    const maxBlockX =
        Math.floor(
            maxX + 0.5
        );


    const minBlockY =
        Math.floor(
            minY + 0.5
        );

    const maxBlockY =
        Math.floor(
            maxY + 0.5
        );


    const minBlockZ =
        Math.floor(
            minZ + 0.5
        );

    const maxBlockZ =
        Math.floor(
            maxZ + 0.5
        );


    for (
        let bx = minBlockX;
        bx <= maxBlockX;
        bx++
    ) {

        for (
            let by = minBlockY;
            by <= maxBlockY;
            by++
        ) {

            for (
                let bz = minBlockZ;
                bz <= maxBlockZ;
                bz++
            ) {

                const type =
                    getBlockType(
                        bx,
                        by,
                        bz
                    );


                /*
                    Air and water do not collide.
                */

                if (
                    !isSolidBlock(type)
                ) {
                    continue;
                }


                /*
                    Block bounds.

                    Block center is bx/by/bz.
                */

                const blockMinX =
                    bx - 0.5;

                const blockMaxX =
                    bx + 0.5;


                const blockMinY =
                    by - 0.5;

                const blockMaxY =
                    by + 0.5;


                const blockMinZ =
                    bz - 0.5;

                const blockMaxZ =
                    bz + 0.5;


                /*
                    AABB intersection.
                */

                if (
                    maxX > blockMinX &&
                    minX < blockMaxX &&

                    maxY > blockMinY &&
                    minY < blockMaxY &&

                    maxZ > blockMinZ &&
                    minZ < blockMaxZ
                ) {

                    return true;
                }
            }
        }
    }


    return false;
}


/* =========================================================
   MOVEMENT COLLISION
========================================================= */

function movePlayer(
    dx,
    dy,
    dz
) {

    /*
        X movement

        We move the player first,
        then check if they entered
        a block.

        If they did, cancel ONLY X.
    */

    if (
        dx !== 0
    ) {

        const newX =
            player.position.x +
            dx;


        if (
            !collidesAt(
                newX,
                player.position.y,
                player.position.z
            )
        ) {

            player.position.x =
                newX;
        }
    }


    /*
        Z movement
    */

    if (
        dz !== 0
    ) {

        const newZ =
            player.position.z +
            dz;


        if (
            !collidesAt(
                player.position.x,
                player.position.y,
                newZ
            )
        ) {

            player.position.z =
                newZ;
        }
    }


    /*
        Y movement.

        This is where floor/ceiling
        collision is handled.
    */

    if (
        dy !== 0
    ) {

        const newY =
            player.position.y +
            dy;


        if (
            !collidesAt(
                player.position.x,
                newY,
                player.position.z
            )
        ) {

            player.position.y =
                newY;

            player.onGround =
                false;

        } else {

            /*
                We collided vertically.

                Find which direction.
            */

            if (
                dy < 0
            ) {

                /*
                    Falling.

                    Push the player upward
                    until their feet are
                    directly on top of
                    the block.
                */

                const feetY =
                    findGroundHeight(
                        player.position.x,
                        player.position.z,
                        player.position.y
                    );


                if (
                    feetY !== null
                ) {

                    player.position.y =
                        feetY;
                }


                player.onGround =
                    true;

            } else {

                /*
                    Hit ceiling.
                */

                const ceilingY =
                    findCeilingHeight(
                        player.position.x,
                        player.position.z,
                        player.position.y
                    );


                if (
                    ceilingY !== null
                ) {

                    player.position.y =
                        ceilingY -
                        PLAYER_HEIGHT;
                }


                player.onGround =
                    false;
            }


            player.velocity.y =
                0;
        }
    }
}


/* =========================================================
   GROUND HEIGHT
========================================================= */

function findGroundHeight(
    x,
    z,
    currentY
) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const samplePoints = [
        [x - halfWidth, z - halfWidth],
        [x + halfWidth, z - halfWidth],
        [x - halfWidth, z + halfWidth],
        [x + halfWidth, z + halfWidth],
        [x, z]
    ];


    let highestTop =
        null;


    /*
        Search several blocks beneath
        the player's feet.
    */

    const startY =
        Math.floor(
            currentY + 0.5
        );


    for (
        let y = startY;
        y >= startY - 3;
        y--
    ) {

        for (
            const [sx, sz]
            of samplePoints
        ) {

            const bx =
                Math.floor(
                    sx + 0.5
                );

            const bz =
                Math.floor(
                    sz + 0.5
                );


            const type =
                getBlockType(
                    bx,
                    y,
                    bz
                );


            if (
                isSolidBlock(type)
            ) {

                const top =
                    y + 0.5;


                if (
                    highestTop === null ||
                    top > highestTop
                ) {

                    highestTop =
                        top;
                }
            }
        }
    }


    return highestTop;
}


/* =========================================================
   CEILING HEIGHT
========================================================= */

function findCeilingHeight(
    x,
    z,
    currentY
) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const samplePoints = [
        [x - halfWidth, z - halfWidth],
        [x + halfWidth, z - halfWidth],
        [x - halfWidth, z + halfWidth],
        [x + halfWidth, z + halfWidth],
        [x, z]
    ];


    let lowestBottom =
        null;


    const startY =
        Math.floor(
            currentY +
            PLAYER_HEIGHT +
            0.5
        );


    for (
        let y = startY;
        y <= startY + 3;
        y++
    ) {

        for (
            const [sx, sz]
            of samplePoints
        ) {

            const bx =
                Math.floor(
                    sx + 0.5
                );

            const bz =
                Math.floor(
                    sz + 0.5
                );


            const type =
                getBlockType(
                    bx,
                    y,
                    bz
                );


            if (
                isSolidBlock(type)
            ) {

                const bottom =
                    y - 0.5;


                if (
                    lowestBottom === null ||
                    bottom < lowestBottom
                ) {

                    lowestBottom =
                        bottom;
                }
            }
        }
    }


    return lowestBottom;
}


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;


        /*
            Number keys
        */

        if (
            event.code.startsWith(
                "Digit"
            )
        ) {

            const number =
                Number(
                    event.code.replace(
                        "Digit",
                        ""
                    )
                );


            if (
                number >= 1 &&
                number <= 9
            ) {

                selectedSlot =
                    number - 1;

                updateHotbar();
            }
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;
    }
);


/* =========================================================
   JUMP
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space" &&
            player.onGround
        ) {

            player.velocity.y =
                JUMP_POWER;

            player.onGround =
                false;
        }
    }
);


/* =========================================================
   POINTER LOCK
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );


startScreen.addEventListener(
    "click",
    () => {

        renderer.domElement
            .requestPointerLock();
    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        if (
            document.pointerLockElement ===
            renderer.domElement
        ) {

            startScreen.style.display =
                "none";

        } else {

            startScreen.style.display =
                "flex";
        }
    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {
            return;
        }


        const sensitivity =
            0.0025;


        player.yaw -=
            event.movementX *
            sensitivity;


        player.pitch -=
            event.movementY *
            sensitivity;


        const limit =
            Math.PI / 2 - 0.05;


        player.pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    player.pitch
                )
            );
    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    delta
) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {
        return;
    }


    let forward = 0;

    let strafe = 0;


    /*
        W/S intentionally reversed.

        W = BACKWARD
        S = FORWARD
    */

    if (
        keys["KeyW"]
    ) {
        forward -= 1;
    }


    if (
        keys["KeyS"]
    ) {
        forward += 1;
    }


    if (
        keys["KeyA"]
    ) {
        strafe -= 1;
    }


    if (
        keys["KeyD"]
    ) {
        strafe += 1;
    }


    if (
        forward === 0 &&
        strafe === 0
    ) {
        return;
    }


    const length =
        Math.sqrt(
            forward * forward +
            strafe * strafe
        );


    forward /=
        length;


    strafe /=
        length;


    /*
        Convert camera direction
        into world direction.
    */

    const sin =
        Math.sin(
            player.yaw
        );


    const cos =
        Math.cos(
            player.yaw
        );


    const moveX =
        (
            strafe * cos +
            forward * sin
        ) *
        MOVE_SPEED *
        delta;


    const moveZ =
        (
            -strafe * sin +
            forward * cos
        ) *
        MOVE_SPEED *
        delta;


    movePlayer(
        moveX,
        0,
        moveZ
    );
}


/* =========================================================
   PHYSICS
========================================================= */

function updatePhysics(
    delta
) {

    /*
        Gravity.
    */

    player.velocity.y -=
        GRAVITY *
        delta;


    movePlayer(
        0,
        player.velocity.y *
        delta,
        0
    );


    /*
        Emergency respawn.
    */

    if (
        player.position.y < -20
    ) {

        findSpawn();

        player.velocity.set(
            0,
            0,
            0
        );
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    /*
        Camera follows the player's
        head position.

        It does NOT participate in
        collision detection.
    */

    camera.position.set(
        player.position.x,
        player.position.y +
            EYE_HEIGHT,
        player.position.z
    );


    /*
        Yaw = turning left/right.

        Pitch = looking up/down.

        YXZ prevents the weird camera
        rotation behavior from happening.
    */

    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        player.yaw;


    camera.rotation.x =
        player.pitch;


    camera.rotation.z =
        0;
}


/* =========================================================
   BREAK / PLACE
========================================================= */

const raycaster =
    new THREE.Raycaster();


const center =
    new THREE.Vector2(
        0,
        0
    );


function getTargetBlock() {

    raycaster.setFromCamera(
        center,
        camera
    );


    const objects =
        Array.from(
            renderedBlocks.values()
        );


    const hits =
        raycaster.intersectObjects(
            objects,
            false
        );


    if (
        hits.length === 0
    ) {

        return null;
    }


    return hits[0];
}


/* =========================================================
   BREAK
========================================================= */

function breakBlock() {

    const hit =
        getTargetBlock();


    if (!hit) {
        return;
    }


    const mesh =
        hit.object;


    const x =
        mesh.userData.x;


    const y =
        mesh.userData.y;


    const z =
        mesh.userData.z;


    if (
        y < 0
    ) {
        return;
    }


    const key =
        blockKey(
            x,
            y,
            z
        );


    /*
        Delete from actual world.

        Therefore it stays broken.
    */

    worldBlocks.delete(
        key
    );


    removeBlockMesh(
        x,
        y,
        z
    );
}


/* =========================================================
   PLACE
========================================================= */

function placeBlock() {

    const hit =
        getTargetBlock();


    if (!hit) {
        return;
    }


    const mesh =
        hit.object;


    const x =
        mesh.userData.x;


    const y =
        mesh.userData.y;


    const z =
        mesh.userData.z;


    /*
        Figure out which face
        the player clicked.
    */

    const normal =
        hit.face.normal.clone();


    const normalWorld =
        normal.transformDirection(
            mesh.matrixWorld
        );


    const nx =
        Math.round(
            normalWorld.x
        );


    const ny =
        Math.round(
            normalWorld.y
        );


    const nz =
        Math.round(
            normalWorld.z
        );


    const placeX =
        x + nx;


    const placeY =
        y + ny;


    const placeZ =
        z + nz;


    /*
        Don't place outside world.
    */

    if (
        placeY < 0 ||
        placeY >= WORLD_HEIGHT
    ) {

        return;
    }


    /*
        Don't place a solid block
        inside the player's body.
    */

    const type =
        BLOCKS[selectedSlot];


    if (
        isSolidBlock(type)
    ) {

        if (
            playerBoxOverlapsBlock(
                placeX,
                placeY,
                placeZ
            )
        ) {

            return;
        }
    }


    const key =
        blockKey(
            placeX,
            placeY,
            placeZ
        );


    if (
        worldBlocks.has(key)
    ) {

        return;
    }


    worldBlocks.set(
        key,
        type
    );


    renderBlock(
        placeX,
        placeY,
        placeZ
    );
}


/* =========================================================
   PLAYER / BLOCK OVERLAP
========================================================= */

function playerBoxOverlapsBlock(
    bx,
    by,
    bz
) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const playerMinX =
        player.position.x -
        halfWidth;


    const playerMaxX =
        player.position.x +
        halfWidth;


    const playerMinY =
        player.position.y;


    const playerMaxY =
        player.position.y +
        PLAYER_HEIGHT;


    const playerMinZ =
        player.position.z -
        halfWidth;


    const playerMaxZ =
        player.position.z +
        halfWidth;


    const blockMinX =
        bx - 0.5;


    const blockMaxX =
        bx + 0.5;


    const blockMinY =
        by - 0.5;


    const blockMaxY =
        by + 0.5;


    const blockMinZ =
        bz - 0.5;


    const blockMaxZ =
        bz + 0.5;


    return (
        playerMaxX > blockMinX &&
        playerMinX < blockMaxX &&

        playerMaxY > blockMinY &&
        playerMinY < blockMaxY &&

        playerMaxZ > blockMinZ &&
        playerMinZ < blockMaxZ
    );
}


/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousedown",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {
            return;
        }


        if (
            event.button === 0
        ) {

            breakBlock();
        }


        if (
            event.button === 2
        ) {

            placeBlock();
        }
    }
);


window.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();
    }
);


/* =========================================================
   HOTBAR
========================================================= */

const hotbar =
    document.getElementById(
        "hotbar"
    );


let selectedSlot = 0;


function createHotbar() {

    hotbar.innerHTML = "";


    BLOCKS.forEach(
        (
            block,
            index
        ) => {

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot";


            if (
                index === selectedSlot
            ) {

                slot.classList.add(
                    "selected"
                );
            }


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "slot-number";


            number.textContent =
                index + 1;


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                TEXTURE_BASE +
                block +
                ".png";


            image.onerror =
                () => {

                    image.style.display =
                        "none";
                };


            slot.appendChild(
                number
            );


            slot.appendChild(
                image
            );


            hotbar.appendChild(
                slot
            );
        }
    );
}


function updateHotbar() {

    const slots =
        document.querySelectorAll(
            ".slot"
        );


    slots.forEach(
        (
            slot,
            index
        ) => {

            slot.classList.toggle(
                "selected",
                index === selectedSlot
            );
        }
    );
}


createHotbar();


/* =========================================================
   SPAWN
========================================================= */

function findSpawn() {

    const height =
        getTerrainHeight(
            0,
            0
        );


    player.position.set(
        0,
        height + 0.51,
        0
    );


    /*
        If spawn is underwater,
        move it upward.
    */

    if (
        getBlockType(
            0,
            Math.floor(
                player.position.y
            ),
            0
        ) === "water"
    ) {

        player.position.y =
            SEA_LEVEL + 1;
    }
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


let worldUpdateTimer =
    0;


function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    let delta =
        (now - lastTime) /
        1000;


    lastTime =
        now;


    /*
        Prevent giant physics
        jumps after tab switching.
    */

    delta =
        Math.min(
            delta,
            0.05
        );


    updateMovement(
        delta
    );


    updatePhysics(
        delta
    );


    updateCamera();


    /*
        Don't rebuild the whole
        render range every frame.
    */

    worldUpdateTimer +=
        delta;


    if (
        worldUpdateTimer > 0.25
    ) {

        worldUpdateTimer = 0;

        renderWorldAroundPlayer();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

findSpawn();

renderWorldAroundPlayer();

updateCamera();


document.getElementById(
    "loading"
).style.display =
    "none";


animate();

</script>

</html>
