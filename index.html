<body>

<div id="loading">Loading world...</div>

<div id="startScreen">
    <h1>Rough Minecraft 3D</h1>
    <p>Click to play</p>
    <p>W/S = Move &nbsp; A/D = Strafe &nbsp; Space = Jump</p>

    <p>1–9 = Select Block</p>
</div>

<div id="crosshair"></div>

<div id="info">
    <div>W/S = Move</div>
    <div>A/D = Strafe</div>
    <div>SPACE = Jump</div>
    <div>Left Click = Break</div>
    <div>Right Click = Place</div>
</div>

<div id="hotbar"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const RENDER_DISTANCE = 16;
const WORLD_HEIGHT = 24;

const BLOCK_SIZE = 1;

const PLAYER_HEIGHT = 1.8;
const PLAYER_WIDTH = 0.6;

const GRAVITY = 25;
const JUMP_POWER = 9;

const MOVE_SPEED = 5;

const TEXTURE_BASE =
    "https://raw.githubusercontent.com/Nwingard802/MINECRAFT/main/IMAGES/";


/* =========================================================
   BLOCK TYPES
========================================================= */

const BLOCKS = [
    "grass",
    "dirt",
    "stone",
    "sand",
    "wood",
    "leaves",
    "brick",
    "glass",
    "cobblestone"
];


/* =========================================================
   THREE.JS
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
    0x87ceeb,
    RENDER_DISTANCE * 0.65,
    RENDER_DISTANCE + 10
);


const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.05,
    200
);


const renderer = new THREE.WebGLRenderer({
    antialias: false
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.7
);

scene.add(ambientLight);


const sun = new THREE.DirectionalLight(
    0xffffff,
    1
);

sun.position.set(
    50,
    100,
    50
);

scene.add(sun);


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader = new THREE.TextureLoader();

const textures = {};
const materials = {};


function loadTexture(name) {

    const texture = textureLoader.load(
        TEXTURE_BASE + name + ".png"
    );

    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;

    texture.colorSpace = THREE.SRGBColorSpace;

    texture.generateMipmaps = false;

    textures[name] = texture;

    return texture;
}


for (const block of BLOCKS) {

    const texture = loadTexture(block);

    materials[block] = new THREE.MeshLambertMaterial({
        map: texture,
        transparent: block === "glass" || block === "leaves",
        opacity: block === "glass" ? 0.65 : 1,
        side: THREE.FrontSide
    });
}


/* =========================================================
   WORLD DATA
========================================================= */

/*
    worldBlocks:

    key = "x,y,z"
    value = block type

    This is the actual world data.

    Once a block is destroyed it is deleted here,
    so it stays destroyed.
*/

const worldBlocks = new Map();


/*
    generatedColumns:

    Keeps track of which terrain columns have already
    been generated.

    This prevents moving around from regenerating terrain.
*/

const generatedColumns = new Set();


/*
    renderedBlocks:

    key -> THREE.Mesh
*/

const renderedBlocks = new Map();


function blockKey(x, y, z) {
    return `${x},${y},${z}`;
}


function columnKey(x, z) {
    return `${x},${z}`;
}


/* =========================================================
   TERRAIN GENERATION
========================================================= */

function getTerrainHeight(x, z) {

    const h =
        6
        + Math.sin(x * 0.18) * 2
        + Math.cos(z * 0.16) * 2
        + Math.sin((x + z) * 0.08) * 2;

    return Math.max(
        2,
        Math.floor(h)
    );
}


function generateColumn(x, z) {

    const cKey = columnKey(x, z);

    if (generatedColumns.has(cKey)) {
        return;
    }

    generatedColumns.add(cKey);

    const height = getTerrainHeight(x, z);

    for (let y = 0; y <= height; y++) {

        let blockType;

        if (y === height) {

            blockType = "grass";

        } else if (y >= height - 3) {

            blockType = "dirt";

        } else {

            blockType = "stone";
        }

        worldBlocks.set(
            blockKey(x, y, z),
            blockType
        );
    }

    /*
        Occasional trees
    */

    const treeChance =
        Math.sin(x * 12.9898 + z * 78.233) *
        43758.5453;

    const random =
        treeChance - Math.floor(treeChance);

    if (
        random > 0.94 &&
        height > 4
    ) {

        generateTree(
            x,
            height + 1,
            z
        );
    }
}


function generateTree(x, y, z) {

    /*
        Trunk
    */

    for (let i = 0; i < 4; i++) {

        const key = blockKey(
            x,
            y + i,
            z
        );

        worldBlocks.set(
            key,
            "wood"
        );
    }


    /*
        Leaves
    */

    for (let dx = -2; dx <= 2; dx++) {

        for (let dz = -2; dz <= 2; dz++) {

            for (let dy = 2; dy <= 4; dy++) {

                if (
                    Math.abs(dx) +
                    Math.abs(dz) +
                    Math.abs(dy - 3)
                    <= 4
                ) {

                    const key = blockKey(
                        x + dx,
                        y + dy,
                        z + dz
                    );

                    if (
                        !worldBlocks.has(key)
                    ) {

                        worldBlocks.set(
                            key,
                            "leaves"
                        );
                    }
                }
            }
        }
    }
}


/* =========================================================
   RENDERING WORLD
========================================================= */

const cubeGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


function createBlockMesh(
    x,
    y,
    z,
    type
) {

    const mesh =
        new THREE.Mesh(
            cubeGeometry,
            materials[type]
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.userData.x = x;
    mesh.userData.y = y;
    mesh.userData.z = z;

    mesh.userData.type = type;

    scene.add(mesh);

    renderedBlocks.set(
        blockKey(x, y, z),
        mesh
    );
}


function removeBlockMesh(x, y, z) {

    const key =
        blockKey(x, y, z);

    const mesh =
        renderedBlocks.get(key);

    if (!mesh) return;

    scene.remove(mesh);

    renderedBlocks.delete(key);
}


function renderBlock(
    x,
    y,
    z
) {

    const key =
        blockKey(x, y, z);

    if (
        renderedBlocks.has(key)
    ) {
        return;
    }

    const type =
        worldBlocks.get(key);

    if (!type) {
        return;
    }

    createBlockMesh(
        x,
        y,
        z,
        type
    );
}


function renderWorldAroundPlayer() {

    const px =
        Math.floor(player.position.x);

    const pz =
        Math.floor(player.position.z);


    /*
        Generate columns first.
    */

    for (
        let x = px - RENDER_DISTANCE;
        x <= px + RENDER_DISTANCE;
        x++
    ) {

        for (
            let z = pz - RENDER_DISTANCE;
            z <= pz + RENDER_DISTANCE;
            z++
        ) {

            generateColumn(
                x,
                z
            );
        }
    }


    /*
        Render blocks inside range.
    */

    for (
        let x = px - RENDER_DISTANCE;
        x <= px + RENDER_DISTANCE;
        x++
    ) {

        for (
            let z = pz - RENDER_DISTANCE;
            z <= pz + RENDER_DISTANCE;
            z++
        ) {

            for (
                let y = 0;
                y < WORLD_HEIGHT;
                y++
            ) {

                renderBlock(
                    x,
                    y,
                    z
                );
            }
        }
    }


    /*
        Remove rendered blocks that are too far away.
    */

    for (
        const [key, mesh]
        of renderedBlocks
    ) {

        const dx =
            mesh.position.x - player.position.x;

        const dz =
            mesh.position.z - player.position.z;

        if (
            Math.abs(dx) >
                RENDER_DISTANCE + 2 ||
            Math.abs(dz) >
                RENDER_DISTANCE + 2
        ) {

            scene.remove(mesh);

            renderedBlocks.delete(key);
        }
    }
}


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position: new THREE.Vector3(
        0,
        12,
        0
    ),

    velocity: new THREE.Vector3(),

    onGround: false,

    yaw: 0,

    pitch: 0
};


camera.position.copy(
    player.position
);

camera.position.y +=
    PLAYER_HEIGHT * 0.5;


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;

        /*
            Number keys
        */

        if (
            event.code.startsWith("Digit")
        ) {

            const number =
                Number(
                    event.code.replace(
                        "Digit",
                        ""
                    )
                );

            if (
                number >= 1 &&
                number <= 9
            ) {

                selectedSlot =
                    number - 1;

                updateHotbar();
            }
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] = false;
    }
);


/* =========================================================
   POINTER LOCK
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );


startScreen.addEventListener(
    "click",
    () => {

        renderer.domElement.requestPointerLock();
    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        if (
            document.pointerLockElement ===
            renderer.domElement
        ) {

            startScreen.style.display =
                "none";

        } else {

            startScreen.style.display =
                "flex";
        }
    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {
            return;
        }

        const sensitivity =
            0.0025;

        player.yaw -=
            event.movementX *
            sensitivity;

        player.pitch -=
            event.movementY *
            sensitivity;

        const limit =
            Math.PI / 2 - 0.05;

        player.pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    player.pitch
                )
            );
    }
);


/* =========================================================
   JUMPING
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space" &&
            player.onGround
        ) {

            player.velocity.y =
                JUMP_POWER;

            player.onGround =
                false;
        }
    }
);


/* =========================================================
   COLLISION
========================================================= */

function isSolid(x, y, z) {

    const key =
        blockKey(
            Math.floor(x),
            Math.floor(y),
            Math.floor(z)
        );

    return worldBlocks.has(key);
}


function collidesAt(
    x,
    y,
    z
) {

    const half =
        PLAYER_WIDTH / 2;

    const minX =
        Math.floor(
            x - half
        );

    const maxX =
        Math.floor(
            x + half
        );

    const minY =
        Math.floor(y);

    const maxY =
        Math.floor(
            y + PLAYER_HEIGHT
        );

    const minZ =
        Math.floor(
            z - half
        );

    const maxZ =
        Math.floor(
            z + half
        );


    for (
        let bx = minX;
        bx <= maxX;
        bx++
    ) {

        for (
            let by = minY;
            by <= maxY;
            by++
        ) {

            for (
                let bz = minZ;
                bz <= maxZ;
                bz++
            ) {

                if (
                    worldBlocks.has(
                        blockKey(
                            bx,
                            by,
                            bz
                        )
                    )
                ) {

                    /*
                        Block boundaries
                    */

                    const blockMinX =
                        bx - 0.5;

                    const blockMaxX =
                        bx + 0.5;

                    const blockMinY =
                        by - 0.5;

                    const blockMaxY =
                        by + 0.5;

                    const blockMinZ =
                        bz - 0.5;

                    const blockMaxZ =
                        bz + 0.5;


                    const playerMinX =
                        x - half;

                    const playerMaxX =
                        x + half;

                    const playerMinY =
                        y;

                    const playerMaxY =
                        y + PLAYER_HEIGHT;

                    const playerMinZ =
                        z - half;

                    const playerMaxZ =
                        z + half;


                    if (
                        playerMaxX > blockMinX &&
                        playerMinX < blockMaxX &&
                        playerMaxY > blockMinY &&
                        playerMinY < blockMaxY &&
                        playerMaxZ > blockMinZ &&
                        playerMinZ < blockMaxZ
                    ) {

                        return true;
                    }
                }
            }
        }
    }

    return false;
}


/* =========================================================
   MOVEMENT
========================================================= */

function movePlayer(
    dx,
    dy,
    dz
) {

    /*
        X
    */

    const nextX =
        player.position.x + dx;

    if (
        !collidesAt(
            nextX,
            player.position.y,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;
    }


    /*
        Z
    */

    const nextZ =
        player.position.z + dz;

    if (
        !collidesAt(
            player.position.x,
            player.position.y,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;
    }


    /*
        Y
    */

    const nextY =
        player.position.y + dy;

    if (
        !collidesAt(
            player.position.x,
            nextY,
            player.position.z
        )
    ) {

        player.position.y =
            nextY;

        player.onGround =
            false;

    } else {

        if (dy < 0) {

            player.onGround =
                true;
        }

        player.velocity.y =
            0;
    }
}


/* =========================================================
   BLOCK BREAKING / PLACING
========================================================= */

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(
        0,
        0
    );


function getTargetBlock() {

    raycaster.setFromCamera(
        center,
        camera
    );

    const objects =
        Array.from(
            renderedBlocks.values()
        );

    const hits =
        raycaster.intersectObjects(
            objects,
            false
        );

    if (
        hits.length === 0
    ) {
        return null;
    }

    return hits[0];
}


function breakBlock() {

    const hit =
        getTargetBlock();

    if (!hit) return;

    const mesh =
        hit.object;

    const x =
        mesh.userData.x;

    const y =
        mesh.userData.y;

    const z =
        mesh.userData.z;

    /*
        Don't allow breaking below world.
    */

    if (y < 0) {
        return;
    }

    const key =
        blockKey(
            x,
            y,
            z
        );

    /*
        Permanently remove it
        from world data.
    */

    worldBlocks.delete(key);

    /*
        Remove visual mesh.
    */

    removeBlockMesh(
        x,
        y,
        z
    );
}


function placeBlock() {

    const hit =
        getTargetBlock();

    if (!hit) return;

    const mesh =
        hit.object;

    const x =
        mesh.userData.x;

    const y =
        mesh.userData.y;

    const z =
        mesh.userData.z;


    /*
        Determine which face was hit.
    */

    const normal =
        hit.face.normal.clone();

    const normalWorld =
        normal.transformDirection(
            mesh.matrixWorld
        );


    const nx =
        Math.round(
            normalWorld.x
        );

    const ny =
        Math.round(
            normalWorld.y
        );

    const nz =
        Math.round(
            normalWorld.z
        );


    const placeX =
        x + nx;

    const placeY =
        y + ny;

    const placeZ =
        z + nz;


    /*
        Don't place inside player.
    */

    const half =
        PLAYER_WIDTH / 2;

    const playerBottom =
        player.position.y;

    const playerTop =
        player.position.y +
        PLAYER_HEIGHT;

    const blockMinX =
        placeX - 0.5;

    const blockMaxX =
        placeX + 0.5;

    const blockMinY =
        placeY - 0.5;

    const blockMaxY =
        placeY + 0.5;

    const blockMinZ =
        placeZ - 0.5;

    const blockMaxZ =
        placeZ + 0.5;


    const playerMinX =
        player.position.x - half;

    const playerMaxX =
        player.position.x + half;

    const playerMinZ =
        player.position.z - half;

    const playerMaxZ =
        player.position.z + half;


    const overlapsPlayer =
        playerMaxX > blockMinX &&
        playerMinX < blockMaxX &&
        playerTop > blockMinY &&
        playerBottom < blockMaxY &&
        playerMaxZ > blockMinZ &&
        playerMinZ < blockMaxZ;


    if (overlapsPlayer) {
        return;
    }


    const key =
        blockKey(
            placeX,
            placeY,
            placeZ
        );


    if (
        worldBlocks.has(key)
    ) {
        return;
    }


    const type =
        BLOCKS[selectedSlot];


    worldBlocks.set(
        key,
        type
    );


    renderBlock(
        placeX,
        placeY,
        placeZ
    );
}


/* =========================================================
   MOUSE BUTTONS
========================================================= */

window.addEventListener(
    "mousedown",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {
            return;
        }


        if (
            event.button === 0
        ) {

            breakBlock();
        }


        if (
            event.button === 2
        ) {

            placeBlock();
        }
    }
);


window.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();
    }
);


/* =========================================================
   HOTBAR
========================================================= */

const hotbar =
    document.getElementById(
        "hotbar"
    );


let selectedSlot = 0;


function createHotbar() {

    hotbar.innerHTML = "";

    BLOCKS.forEach(
        (block, index) => {

            const slot =
                document.createElement(
                    "div"
                );

            slot.className =
                "slot";


            if (
                index === selectedSlot
            ) {

                slot.classList.add(
                    "selected"
                );
            }


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "slot-number";

            number.textContent =
                index + 1;


            const image =
                document.createElement(
                    "img"
                );

            image.src =
                TEXTURE_BASE +
                block +
                ".png";


            image.onerror =
                () => {

                    image.style.display =
                        "none";
                };


            slot.appendChild(
                number
            );

            slot.appendChild(
                image
            );

            hotbar.appendChild(
                slot
            );
        }
    );
}


function updateHotbar() {

    const slots =
        document.querySelectorAll(
            ".slot"
        );

    slots.forEach(
        (slot, index) => {

            slot.classList.toggle(
                "selected",
                index === selectedSlot
            );
        }
    );
}


createHotbar();


/* =========================================================
   PLAYER CAMERA
========================================================= */

function updateCamera() {

    camera.position.set(
        player.position.x,
        player.position.y +
            PLAYER_HEIGHT * 0.82,
        player.position.z
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        player.yaw;


    camera.rotation.x =
        player.pitch;
}


/* =========================================================
   MOVEMENT UPDATE
========================================================= */

function updateMovement(delta) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {
        return;
    }


    let forward = 0;
    let strafe = 0;


    /*
        IMPORTANT:

        W and S are intentionally reversed.

        W = backward
        S = forward
    */

    if (keys["KeyW"]) {
        forward -= 1;
    }

    if (keys["KeyS"]) {
        forward += 1;
    }

    if (keys["KeyA"]) {
        strafe -= 1;
    }

    if (keys["KeyD"]) {
        strafe += 1;
    }


    if (
        forward !== 0 ||
        strafe !== 0
    ) {

        const length =
            Math.sqrt(
                forward * forward +
                strafe * strafe
            );

        forward /= length;
        strafe /= length;


        /*
            Camera direction
        */

        const sin =
            Math.sin(
                player.yaw
            );

        const cos =
            Math.cos(
                player.yaw
            );


        const moveX =
            (
                strafe * cos +
                forward * sin
            ) *
            MOVE_SPEED *
            delta;


        const moveZ =
            (
                -strafe * sin +
                forward * cos
            ) *
            MOVE_SPEED *
            delta;


        movePlayer(
            moveX,
            0,
            moveZ
        );
    }
}


/* =========================================================
   PHYSICS
========================================================= */

function updatePhysics(delta) {

    player.velocity.y -=
        GRAVITY *
        delta;


    movePlayer(
        0,
        player.velocity.y *
        delta,
        0
    );


    /*
        Safety respawn if player falls
        through the world.
    */

    if (
        player.position.y < -20
    ) {

        player.position.set(
            0,
            15,
            0
        );

        player.velocity.set(
            0,
            0,
            0
        );
    }
}


/* =========================================================
   WORLD STARTUP
========================================================= */

function findSpawnHeight() {

    const height =
        getTerrainHeight(
            0,
            0
        );

    player.position.set(
        0,
        height + 1.1,
        0
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    let delta =
        (now - lastTime) / 1000;


    lastTime = now;


    /*
        Prevent giant physics jumps
        after tab switching.
    */

    delta =
        Math.min(
            delta,
            0.05
        );


    updateMovement(
        delta
    );


    updatePhysics(
        delta
    );


    updateCamera();


    /*
        Update world around player
        occasionally rather than every
        single frame.
    */

    if (
        Math.random() < 0.08
    ) {

        renderWorldAroundPlayer();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

findSpawnHeight();

renderWorldAroundPlayer();

updateCamera();

document.getElementById(
    "loading"
).style.display = "none";

animate();

</script>
