<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rough Minecraft 3D</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #87ceeb;

    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}


/* =========================================================
   CROSSHAIR
========================================================= */

#crosshair {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 5px;
    height: 5px;

    background: white;

    border: 1px solid black;

    z-index: 10;

    pointer-events: none;
}


/* =========================================================
   HEALTH
========================================================= */

#health {

    position: fixed;

    top: 12px;
    left: 12px;

    display: flex;

    gap: 2px;

    z-index: 30;

    pointer-events: none;

    image-rendering: pixelated;
}

.heart {

    width: 22px;
    height: 22px;

    object-fit: contain;

    image-rendering: pixelated;

    filter:
        drop-shadow(1px 1px 1px black);
}


/* =========================================================
   HOTBAR
========================================================= */

#hotbar {

    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 4px;

    padding: 5px;

    background: rgba(0,0,0,0.55);

    border: 2px solid rgba(255,255,255,0.3);

    z-index: 20;
}

.slot {

    width: 52px;
    height: 52px;

    border: 2px solid #777;

    background: rgba(30,30,30,0.8);

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;
}

.slot.selected {

    border: 3px solid white;

    background: rgba(100,100,100,0.8);
}

.slot img {

    width: 42px;
    height: 42px;

    object-fit: cover;

    image-rendering: pixelated;
}

.slot-number {

    position: absolute;

    left: 3px;
    top: 2px;

    color: white;

    font-size: 12px;

    font-weight: bold;

    text-shadow: 1px 1px 2px black;
}


/* =========================================================
   INFO
========================================================= */

#info {

    position: fixed;

    top: 42px;
    left: 10px;

    color: white;

    font-size: 14px;

    line-height: 1.5;

    text-shadow: 2px 2px 3px black;

    z-index: 20;

    pointer-events: none;
}


/* =========================================================
   LOADING
========================================================= */

#loading {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #87ceeb;

    color: white;

    font-size: 28px;

    font-weight: bold;

    text-shadow: 2px 2px 4px black;

    z-index: 100;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: rgba(0,0,0,0.35);

    color: white;

    text-align: center;

    text-shadow: 2px 2px 4px black;

    z-index: 50;

    cursor: pointer;
}

#startScreen h1 {

    font-size: 48px;

    margin:
        0
        0
        10px;
}

#startScreen p {

    font-size: 18px;
}


/* =========================================================
   DAMAGE FLASH
========================================================= */

#damageFlash {

    position: fixed;

    inset: 0;

    background: rgba(255,0,0,0);

    pointer-events: none;

    z-index: 40;

    transition:
        background 0.12s;
}


/* =========================================================
   DEATH SCREEN
========================================================= */

#deathScreen {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: rgba(0,0,0,0.75);

    color: white;

    z-index: 90;

    text-shadow:
        2px 2px 4px black;
}

#deathScreen h1 {

    font-size: 48px;

    margin: 0 0 10px;
}

#deathScreen p {

    font-size: 18px;
}

</style>
</head>


<body>


<div id="loading">
    Loading world...
</div>


<div id="startScreen">

    <h1>
        Rough Minecraft 3D
    </h1>

    <p>
        Click to play
    </p>

    <p>
        W/S = Move
        &nbsp;
        A/D = Strafe
        &nbsp;
        Space = Jump
    </p>

    <p>
        Left Click = Break
        &nbsp;
        Right Click = Place
    </p>

    <p>
        1–9 = Select Block
    </p>

</div>


<div id="deathScreen">

    <h1>
        You Died
    </h1>

    <p>
        Respawning...
    </p>

</div>


<div id="damageFlash"></div>


<div id="health"></div>


<div id="crosshair"></div>


<div id="info">

    <div>
        W/S = Move
    </div>

    <div>
        A/D = Strafe
    </div>

    <div>
        SPACE = Jump
    </div>

    <div>
        LEFT CLICK = Break
    </div>

    <div>
        RIGHT CLICK = Place
    </div>

</div>


<div id="hotbar"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>


/* =========================================================
   SETTINGS
========================================================= */

const RENDER_DISTANCE = 32;

const CHUNK_SIZE = 8;

const WORLD_HEIGHT = 24;

const SEA_LEVEL = 4;

const GRAVITY = 25;

const JUMP_POWER = 9;

const MOVE_SPEED = 5;

const WATER_SPEED_MULTIPLIER = 0.4;

const PLAYER_WIDTH = 0.6;

const PLAYER_HEIGHT = 1.8;

const EYE_HEIGHT = 1.62;


/*
    Health
*/

const MAX_HEALTH = 20;

let health = MAX_HEALTH;


/*
    Fall damage starts after
    this many blocks of falling.
*/

const FALL_DAMAGE_START = 4;


/*
    How much damage per extra
    block of falling.
*/

const FALL_DAMAGE_PER_BLOCK = 1;


/*
    Respawn delay.
*/

const RESPAWN_DELAY = 1200;


/* =========================================================
   TEXTURES
========================================================= */

const TEXTURE_BASE =
    "https://raw.githubusercontent.com/Nwingard802/MINECRAFT/main/IMAGES/";


/* =========================================================
   BLOCKS
========================================================= */

const BLOCKS = [

    "grass",

    "dirt",

    "stone",

    "sand",

    "wood",

    "leaves",

    "brick",

    "cobblestone",

    "water"

];


const NON_SOLID_BLOCKS =
    new Set([

        "water",

        "leaves"

    ]);


function isSolidBlock(type) {

    if (!type) {
        return false;
    }

    return !NON_SOLID_BLOCKS.has(type);
}


/* =========================================================
   THREE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87ceeb
    );


scene.fog =
    new THREE.Fog(
        0x87ceeb,

        RENDER_DISTANCE * 0.65,

        RENDER_DISTANCE + 10
    );


const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.05,

        200

    );


const renderer =
    new THREE.WebGLRenderer({

        antialias: false

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        1.25

    )

);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight =
    new THREE.AmbientLight(

        0xffffff,

        0.7

    );


scene.add(
    ambientLight
);


const sun =
    new THREE.DirectionalLight(

        0xffffff,

        1

    );


sun.position.set(

    50,

    100,

    50

);


scene.add(
    sun
);


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader =
    new THREE.TextureLoader();


const textures = {};

const materials = {};


function loadTexture(name) {

    const texture =
        textureLoader.load(

            TEXTURE_BASE +
            name +
            ".png"

        );


    texture.magFilter =
        THREE.NearestFilter;


    texture.minFilter =
        THREE.NearestFilter;


    texture.generateMipmaps =
        false;


    texture.colorSpace =
        THREE.SRGBColorSpace;


    textures[name] =
        texture;


    return texture;
}


for (
    const block of BLOCKS
) {

    const texture =
        loadTexture(block);


    if (
        block === "water"
    ) {

        materials[block] =

            new THREE.MeshLambertMaterial({

                map: texture,

                transparent: true,

                opacity: 0.65,

                depthWrite: false,

                side: THREE.DoubleSide,

                forceSinglePass: true

            });


    } else if (
        block === "leaves"
    ) {

        materials[block] =

            new THREE.MeshLambertMaterial({

                map: texture,

                transparent: true,

                opacity: 0.9,

                side: THREE.DoubleSide,

                forceSinglePass: true

            });


    } else {

        materials[block] =

            new THREE.MeshLambertMaterial({

                map: texture

            });

    }

}


/* =========================================================
   HEART TEXTURES
========================================================= */

const heartTextures = {

    full:
        textureLoader.load(
            TEXTURE_BASE +
            "heart.png"
        ),

    half:
        textureLoader.load(
            TEXTURE_BASE +
            "half.png"
        ),

    empty:
        textureLoader.load(
            TEXTURE_BASE +
            "empty.png"
        )

};


for (
    const texture of
    Object.values(heartTextures)
) {

    texture.magFilter =
        THREE.NearestFilter;

    texture.minFilter =
        THREE.NearestFilter;

    texture.generateMipmaps =
        false;

}


/* =========================================================
   HEALTH UI
========================================================= */

const healthUI =
    document.getElementById(
        "health"
    );


function updateHealthUI() {

    healthUI.innerHTML = "";


    const hearts =
        MAX_HEALTH / 2;


    for (
        let i = 0;
        i < hearts;
        i++
    ) {

        const img =
            document.createElement(
                "img"
            );


        img.className =
            "heart";


        const heartValue =
            health -
            i * 2;


        if (
            heartValue >= 2
        ) {

            img.src =
                TEXTURE_BASE +
                "heart.png";


        } else if (
            heartValue === 1
        ) {

            img.src =
                TEXTURE_BASE +
                "half.png";


        } else {

            img.src =
                TEXTURE_BASE +
                "empty.png";
        }


        healthUI.appendChild(
            img
        );
    }

}


/* =========================================================
   DAMAGE
========================================================= */

let damageCooldown = 0;


function damagePlayer(amount) {

    if (
        health <= 0
    ) {
        return;
    }


    if (
        damageCooldown > 0
    ) {
        return;
    }


    amount =
        Math.max(
            0,
            Math.floor(amount)
        );


    if (
        amount <= 0
    ) {
        return;
    }


    health =
        Math.max(
            0,
            health - amount
        );


    damageCooldown =
        0.25;


    updateHealthUI();


    const flash =
        document.getElementById(
            "damageFlash"
        );


    flash.style.background =
        "rgba(255,0,0,0.35)";


    setTimeout(
        () => {

            flash.style.background =
                "rgba(255,0,0,0)";

        },

        120
    );


    if (
        health <= 0
    ) {

        killPlayer();
    }

}


/* =========================================================
   DEATH
========================================================= */

let dead = false;


function killPlayer() {

    if (
        dead
    ) {
        return;
    }


    dead = true;


    const deathScreen =
        document.getElementById(
            "deathScreen"
        );


    deathScreen.style.display =
        "flex";


    setTimeout(
        () => {

            health =
                MAX_HEALTH;


            updateHealthUI();


            findSpawn();


            player.velocity.set(
                0,
                0,
                0
            );


            player.onGround =
                false;


            dead = false;


            deathScreen.style.display =
                "none";

        },

        RESPAWN_DELAY
    );

}


/* =========================================================
   WORLD DATA
========================================================= */

const worldBlocks =
    new Map();


const generatedColumns =
    new Set();


function blockKey(
    x,
    y,
    z
) {

    return (
        `${x},${y},${z}`
    );
}


function columnKey(
    x,
    z
) {

    return (
        `${x},${z}`
    );
}


function chunkKey(
    cx,
    cz
) {

    return (
        `${cx},${cz}`
    );
}


/* =========================================================
   CHUNK DATA
========================================================= */

const loadedChunks =
    new Map();


function worldToChunk(
    x
) {

    return Math.floor(
        x / CHUNK_SIZE
    );

}


function chunkStart(
    c
) {

    return (
        c * CHUNK_SIZE
    );

}


/* =========================================================
   TERRAIN
========================================================= */

function getTerrainHeight(
    x,
    z
) {

    const h =

        6

        + Math.sin(
            x * 0.18
        ) * 2

        + Math.cos(
            z * 0.16
        ) * 2

        + Math.sin(
            (x + z) * 0.08
        ) * 2;


    return Math.max(

        2,

        Math.floor(h)

    );

}


/* =========================================================
   COLUMN GENERATION
========================================================= */

function generateColumn(
    x,
    z
) {

    const cKey =
        columnKey(
            x,
            z
        );


    if (
        generatedColumns.has(
            cKey
        )
    ) {

        return;
    }


    generatedColumns.add(
        cKey
    );


    const terrainHeight =
        getTerrainHeight(
            x,
            z
        );


    for (
        let y = 0;
        y <= terrainHeight;
        y++
    ) {

        let type;


        if (
            y === terrainHeight
        ) {

            type =
                terrainHeight <=
                SEA_LEVEL + 1

                    ? "sand"

                    : "grass";


        } else if (
            y >=
            terrainHeight - 3
        ) {

            type =
                terrainHeight <=
                SEA_LEVEL + 1

                    ? "sand"

                    : "dirt";


        } else {

            type =
                "stone";

        }


        worldBlocks.set(

            blockKey(
                x,
                y,
                z
            ),

            type

        );

    }


    /*
        Water.
    */

    if (
        terrainHeight <
        SEA_LEVEL
    ) {

        for (
            let y =
                terrainHeight + 1;

            y <= SEA_LEVEL;

            y++
        ) {

            worldBlocks.set(

                blockKey(
                    x,
                    y,
                    z
                ),

                "water"

            );

        }

    }


    /*
        Trees.
    */

    if (
        terrainHeight >
        SEA_LEVEL + 1
    ) {

        const treeChance =

            Math.sin(
                x * 12.9898 +
                z * 78.233
            ) *

            43758.5453;


        const random =

            treeChance -
            Math.floor(
                treeChance
            );


        if (
            random > 0.94
        ) {

            generateTree(

                x,

                terrainHeight + 1,

                z

            );

        }

    }

}


/* =========================================================
   TREES
========================================================= */

function generateTree(
    x,
    y,
    z
) {

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        worldBlocks.set(

            blockKey(
                x,
                y + i,
                z
            ),

            "wood"

        );

    }


    for (
        let dx = -2;
        dx <= 2;
        dx++
    ) {

        for (
            let dz = -2;
            dz <= 2;
            dz++
        ) {

            for (
                let dy = 2;
                dy <= 4;
                dy++
            ) {

                if (

                    Math.abs(dx) +

                    Math.abs(dz) +

                    Math.abs(dy - 3)

                    <= 4

                ) {

                    const key =

                        blockKey(

                            x + dx,

                            y + dy,

                            z + dz

                        );


                    if (
                        !worldBlocks.has(
                            key
                        )
                    ) {

                        worldBlocks.set(

                            key,

                            "leaves"

                        );

                    }

                }

            }

        }

    }

}


/* =========================================================
   GENERATE WORLD AREA
========================================================= */

function generateWorldAroundPlayer() {

    const px =
        Math.floor(
            player.position.x
        );


    const pz =
        Math.floor(
            player.position.z
        );


    for (
        let x =
            px - RENDER_DISTANCE;

        x <=
            px + RENDER_DISTANCE;

        x++
    ) {

        for (
            let z =
                pz - RENDER_DISTANCE;

            z <=
                pz + RENDER_DISTANCE;

            z++
        ) {

            generateColumn(
                x,
                z
            );

        }

    }

}


/* =========================================================
   CHUNK MESHING
========================================================= */

/*
    Each chunk becomes ONE mesh.

    We only create faces which are
    exposed to air / transparent blocks.

    This is dramatically less geometry
    than making a cube for every block.
*/


const FACE_DATA = [

    /*
        +X
    */

    {

        dir: [1, 0, 0],

        normal: [1, 0, 0],

        vertices: [

            [0.5,-0.5,-0.5],

            [0.5, 0.5,-0.5],

            [0.5, 0.5, 0.5],

            [0.5,-0.5, 0.5]

        ]

    },


    /*
        -X
    */

    {

        dir: [-1, 0, 0],

        normal: [-1, 0, 0],

        vertices: [

            [-0.5,-0.5, 0.5],

            [-0.5, 0.5, 0.5],

            [-0.5, 0.5,-0.5],

            [-0.5,-0.5,-0.5]

        ]

    },


    /*
        +Y
    */

    {

        dir: [0, 1, 0],

        normal: [0, 1, 0],

        vertices: [

            [-0.5,0.5, 0.5],

            [ 0.5,0.5, 0.5],

            [ 0.5,0.5,-0.5],

            [-0.5,0.5,-0.5]

        ]

    },


    /*
        -Y
    */

    {

        dir: [0,-1,0],

        normal: [0,-1,0],

        vertices: [

            [-0.5,-0.5,-0.5],

            [ 0.5,-0.5,-0.5],

            [ 0.5,-0.5, 0.5],

            [-0.5,-0.5, 0.5]

        ]

    },


    /*
        +Z
    */

    {

        dir: [0,0,1],

        normal: [0,0,1],

        vertices: [

            [0.5,-0.5,0.5],

            [0.5, 0.5,0.5],

            [-0.5,0.5,0.5],

            [-0.5,-0.5,0.5]

        ]

    },


    /*
        -Z
    */

    {

        dir: [0,0,-1],

        normal: [0,0,-1],

        vertices: [

            [-0.5,-0.5,-0.5],

            [-0.5, 0.5,-0.5],

            [ 0.5, 0.5,-0.5],

            [ 0.5,-0.5,-0.5]

        ]

    }

];


const FACE_UVS = [

    [0,0],

    [1,0],

    [1,1],

    [0,1]

];


/* =========================================================
   FACE EXPOSURE
========================================================= */

function shouldRenderFace(
    type,
    nx,
    ny,
    nz
) {

    const neighbor =
        getBlockType(
            nx,
            ny,
            nz
        );


    if (!neighbor) {

        return true;

    }


    /*
        Transparent blocks expose
        neighboring surfaces.

        Water touching water does
        not need another face.
    */

    if (
        neighbor === type
    ) {

        return false;

    }


    if (
        NON_SOLID_BLOCKS.has(
            neighbor
        )
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   CHUNK MESH
========================================================= */

function buildChunk(
    cx,
    cz
) {

    const key =
        chunkKey(
            cx,
            cz
        );


    /*
        Remove old chunk first.
    */

    removeChunk(
        cx,
        cz
    );


    const startX =
        chunkStart(
            cx
        );


    const startZ =
        chunkStart(
            cz
        );


    /*
        One face collection per block type.

        This lets us use one material per
        block type while still keeping a
        single chunk mesh.
    */

    const faceGroups = {};


    for (
        const block of BLOCKS
    ) {

        faceGroups[block] = [];

    }


    /*
        Generate exposed faces.
    */

    for (
        let x = startX;

        x <
        startX + CHUNK_SIZE;

        x++
    ) {

        for (
            let z = startZ;

            z <
            startZ + CHUNK_SIZE;

            z++
        ) {

            for (
                let y = 0;

                y < WORLD_HEIGHT;

                y++
            ) {

                const type =
                    getBlockType(
                        x,
                        y,
                        z
                    );


                if (!type) {
                    continue;
                }


                /*
                    Only create faces that
                    are actually visible.
                */

                for (
                    const face
                    of FACE_DATA
                ) {

                    const nx =
                        x +
                        face.dir[0];

                    const ny =
                        y +
                        face.dir[1];

                    const nz =
                        z +
                        face.dir[2];


                    if (
                        !shouldRenderFace(

                            type,

                            nx,
                            ny,
                            nz

                        )
                    ) {

                        continue;

                    }


                    faceGroups[type].push({

                        x,
                        y,
                        z,

                        face

                    });

                }

            }

        }

    }


    /*
        Geometry arrays.
    */

    const positions = [];

    const normals = [];

    const uvs = [];

    /*
        Used to identify the block
        when raycasting.
    */

    const blockForTriangle = [];


    /*
        Material order.
    */

    const materialList =
        [];


    /*
        Build the geometry.
    */

    for (
        const type of BLOCKS
    ) {

        const faces =
            faceGroups[type];


        if (
            faces.length === 0
        ) {

            continue;

        }


        materialList.push(
            materials[type]
        );


        for (
            const item of faces
        ) {

            const {
                x,
                y,
                z,
                face
            } = item;


            /*
                Four vertices.
            */

            for (
                let i = 0;
                i < 4;
                i++
            ) {

                const v =
                    face.vertices[i];


                positions.push(

                    x + v[0],

                    y + v[1],

                    z + v[2]

                );


                normals.push(

                    face.normal[0],

                    face.normal[1],

                    face.normal[2]

                );


                uvs.push(

                    FACE_UVS[i][0],

                    FACE_UVS[i][1]

                );

            }


            /*
                Two triangles.

                Triangle 1:
                0 1 2

                Triangle 2:
                0 2 3
            */

            blockForTriangle.push({

                x,
                y,
                z

            });


            blockForTriangle.push({

                x,
                y,
                z

            });

        }

    }


    if (
        positions.length === 0
    ) {

        loadedChunks.set(
            key,
            {
                mesh: null,
                geometry: null
            }
        );

        return;

    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(

            positions,

            3

        )

    );


    geometry.setAttribute(

        "normal",

        new THREE.Float32BufferAttribute(

            normals,

            3

        )

    );


    geometry.setAttribute(

        "uv",

        new THREE.Float32BufferAttribute(

            uvs,

            2

        )

    );


    /*
        We need groups because each
        block type has a different texture.

        Since the vertices are already
        grouped by block type, each type
        gets one draw group.
    */

    let vertexStart = 0;


    let materialIndex = 0;


    for (
        const type of BLOCKS
    ) {

        const faces =
            faceGroups[type];


        if (
            faces.length === 0
        ) {

            continue;

        }


        const vertexCount =
            faces.length *
            6;


        geometry.addGroup(

            vertexStart,

            vertexCount,

            materialIndex

        );


        vertexStart +=
            vertexCount;


        materialIndex++;

    }


    geometry.userData.blockForTriangle =
        blockForTriangle;


    geometry.computeBoundingSphere();


    const mesh =
        new THREE.Mesh(

            geometry,

            materialList

        );


    mesh.userData.chunkX =
        cx;

    mesh.userData.chunkZ =
        cz;


    scene.add(
        mesh
    );


    loadedChunks.set(

        key,

        {

            mesh,

            geometry

        }

    );

}


/* =========================================================
   REMOVE CHUNK
========================================================= */

function removeChunk(
    cx,
    cz
) {

    const key =
        chunkKey(
            cx,
            cz
        );


    const chunk =
        loadedChunks.get(
            key
        );


    if (!chunk) {
        return;
    }


    if (
        chunk.mesh
    ) {

        scene.remove(
            chunk.mesh
        );

    }


    if (
        chunk.geometry
    ) {

        chunk.geometry.dispose();

    }


    loadedChunks.delete(
        key
    );

}


/* =========================================================
   LOAD VISIBLE CHUNKS
========================================================= */

function updateChunks() {

    generateWorldAroundPlayer();


    const pcx =
        worldToChunk(
            player.position.x
        );


    const pcz =
        worldToChunk(
            player.position.z
        );


    const chunkRadius =
        Math.ceil(
            RENDER_DISTANCE /
            CHUNK_SIZE
        );


    const needed =
        new Set();


    for (
        let cx =
            pcx - chunkRadius;

        cx <=
            pcx + chunkRadius;

        cx++
    ) {

        for (
            let cz =
            pcz - chunkRadius;

            cz <=
                pcz + chunkRadius;

            cz++
        ) {

            const centerX =
                cx *
                CHUNK_SIZE +
                CHUNK_SIZE / 2;


            const centerZ =
                cz *
                CHUNK_SIZE +
                CHUNK_SIZE / 2;


            const dx =
                centerX -
                player.position.x;


            const dz =
                centerZ -
                player.position.z;


            /*
                Circular render distance.
            */

            if (
                dx * dx +
                dz * dz >
                RENDER_DISTANCE *
                RENDER_DISTANCE
            ) {

                continue;

            }


            const key =
                chunkKey(
                    cx,
                    cz
                );


            needed.add(
                key
            );


            if (
                !loadedChunks.has(
                    key
                )
            ) {

                buildChunk(
                    cx,
                    cz
                );

            }

        }

    }


    /*
        Remove chunks outside
        render distance.
    */

    for (
        const [
            key,
            chunk
        ]
        of loadedChunks
    ) {

        if (
            needed.has(
                key
            )
        ) {

            continue;

        }


        const comma =
            key.indexOf(",");


        const cx =
            Number(
                key.slice(
                    0,
                    comma
                )
            );


        const cz =
            Number(
                key.slice(
                    comma + 1
                )
            );


        removeChunk(
            cx,
            cz
        );

    }

}


/* =========================================================
   REBUILD CHUNK AFTER EDIT
========================================================= */

function rebuildAffectedChunks(
    x,
    y,
    z
) {

    const cx =
        worldToChunk(
            x
        );


    const cz =
        worldToChunk(
            z
        );


    /*
        Editing a block can change the
        faces of neighboring chunks.

        So rebuild this chunk and
        any chunk touching its edge.
    */

    const chunks =
        new Set();


    chunks.add(
        chunkKey(
            cx,
            cz
        )
    );


    if (
        x ===
        chunkStart(cx)
    ) {

        chunks.add(
            chunkKey(
                cx - 1,
                cz
            )
        );

    }


    if (
        x ===
        chunkStart(cx) +
        CHUNK_SIZE - 1
    ) {

        chunks.add(
            chunkKey(
                cx + 1,
                cz
            )
        );

    }


    if (
        z ===
        chunkStart(cz)
    ) {

        chunks.add(
            chunkKey(
                cx,
                cz - 1
            )
        );

    }


    if (
        z ===
        chunkStart(cz) +
        CHUNK_SIZE - 1
    ) {

        chunks.add(
            chunkKey(
                cx,
                cz + 1
            )
        );

    }


    for (
        const key
        of chunks
    ) {

        if (
            !loadedChunks.has(
                key
            )
        ) {

            continue;

        }


        const comma =
            key.indexOf(",");


        const tcx =
            Number(
                key.slice(
                    0,
                    comma
                )
            );


        const tcz =
            Number(
                key.slice(
                    comma + 1
                )
            );


        buildChunk(
            tcx,
            tcz
        );

    }

}


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:
        new THREE.Vector3(
            0,
            10,
            0
        ),

    velocity:
        new THREE.Vector3(
            0,
            0,
            0
        ),

    onGround: false,

    yaw: 0,

    pitch: 0

};


/*
    Used for fall damage.
*/

let fallStartY =
    null;


/* =========================================================
   BLOCK LOOKUP
========================================================= */

function getBlockType(
    x,
    y,
    z
) {

    return worldBlocks.get(

        blockKey(

            Math.floor(x),

            Math.floor(y),

            Math.floor(z)

        )

    );

}


/* =========================================================
   COLLISION
========================================================= */

function collidesAt(
    x,
    y,
    z
) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const minX =
        x -
        halfWidth;


    const maxX =
        x +
        halfWidth;


    const minY =
        y;


    const maxY =
        y +
        PLAYER_HEIGHT;


    const minZ =
        z -
        halfWidth;


    const maxZ =
        z +
        halfWidth;


    const minBlockX =
        Math.floor(
            minX + 0.5
        );


    const maxBlockX =
        Math.floor(
            maxX + 0.5
        );


    const minBlockY =
        Math.floor(
            minY + 0.5
        );


    const maxBlockY =
        Math.floor(
            maxY + 0.5
        );


    const minBlockZ =
        Math.floor(
            minZ + 0.5
        );


    const maxBlockZ =
        Math.floor(
            maxZ + 0.5
        );


    for (
        let bx =
            minBlockX;

        bx <=
            maxBlockX;

        bx++
    ) {

        for (
            let by =
                minBlockY;

            by <=
                maxBlockY;

            by++
        ) {

            for (
                let bz =
                    minBlockZ;

                bz <=
                    maxBlockZ;

                bz++
            ) {

                const type =
                    getBlockType(
                        bx,
                        by,
                        bz
                    );


                if (
                    !isSolidBlock(
                        type
                    )
                ) {

                    continue;

                }


                const blockMinX =
                    bx - 0.5;


                const blockMaxX =
                    bx + 0.5;


                const blockMinY =
                    by - 0.5;


                const blockMaxY =
                    by + 0.5;


                const blockMinZ =
                    bz - 0.5;


                const blockMaxZ =
                    bz + 0.5;


                if (

                    maxX >
                    blockMinX &&

                    minX <
                    blockMaxX &&

                    maxY >
                    blockMinY &&

                    minY <
                    blockMaxY &&

                    maxZ >
                    blockMinZ &&

                    minZ <
                    blockMaxZ

                ) {

                    return true;

                }

            }

        }

    }


    return false;

}


/* =========================================================
   WATER
========================================================= */

function isPlayerInWater() {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const minX =
        player.position.x -
        halfWidth;


    const maxX =
        player.position.x +
        halfWidth;


    const minY =
        player.position.y;


    const maxY =
        player.position.y +
        PLAYER_HEIGHT;


    const minZ =
        player.position.z -
        halfWidth;


    const maxZ =
        player.position.z +
        halfWidth;


    const minBlockX =
        Math.floor(
            minX + 0.5
        );


    const maxBlockX =
        Math.floor(
            maxX + 0.5
        );


    const minBlockY =
        Math.floor(
            minY + 0.5
        );


    const maxBlockY =
        Math.floor(
            maxY + 0.5
        );


    const minBlockZ =
        Math.floor(
            minZ + 0.5
        );


    const maxBlockZ =
        Math.floor(
            maxZ + 0.5
        );


    for (
        let x =
            minBlockX;

        x <=
            maxBlockX;

        x++
    ) {

        for (
            let y =
                minBlockY;

            y <=
                maxBlockY;

            y++
        ) {

            for (
                let z =
                    minBlockZ;

                z <=
                    maxBlockZ;

                z++
            ) {

                if (
                    getBlockType(
                        x,
                        y,
                        z
                    ) ===
                    "water"
                ) {

                    return true;

                }

            }

        }

    }


    return false;

}


/* =========================================================
   GROUND HEIGHT
========================================================= */

function findGroundHeight(
    x,
    z,
    currentY
) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const points = [

        [
            x - halfWidth,
            z - halfWidth
        ],

        [
            x + halfWidth,
            z - halfWidth
        ],

        [
            x - halfWidth,
            z + halfWidth
        ],

        [
            x + halfWidth,
            z + halfWidth
        ],

        [
            x,
            z
        ]

    ];


    let highest =
        null;


    const startY =
        Math.floor(
            currentY + 0.5
        );


    for (
        let y =
            startY;

        y >=
            startY - 4;

        y--
    ) {

        for (
            const [sx, sz]
            of points
        ) {

            const bx =
                Math.floor(
                    sx + 0.5
                );


            const bz =
                Math.floor(
                    sz + 0.5
                );


            const type =
                getBlockType(
                    bx,
                    y,
                    bz
                );


            if (
                isSolidBlock(
                    type
                )
            ) {

                const top =
                    y + 0.5;


                if (
                    highest === null ||
                    top > highest
                ) {

                    highest =
                        top;

                }

            }

        }

    }


    return highest;

}


/* =========================================================
   CEILING
========================================================= */

function findCeilingHeight(
    x,
    z,
    currentY
) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const points = [

        [
            x - halfWidth,
            z - halfWidth
        ],

        [
            x + halfWidth,
            z - halfWidth
        ],

        [
            x - halfWidth,
            z + halfWidth
        ],

        [
            x + halfWidth,
            z + halfWidth
        ],

        [
            x,
            z
        ]

    ];


    let lowest =
        null;


    const startY =
        Math.floor(

            currentY +
            PLAYER_HEIGHT +
            0.5

        );


    for (
        let y =
            startY;

        y <=
            startY + 4;

        y++
    ) {

        for (
            const [sx, sz]
            of points
        ) {

            const bx =
                Math.floor(
                    sx + 0.5
                );


            const bz =
                Math.floor(
                    sz + 0.5
                );


            const type =
                getBlockType(
                    bx,
                    y,
                    bz
                );


            if (
                isSolidBlock(
                    type
                )
            ) {

                const bottom =
                    y - 0.5;


                if (
                    lowest === null ||
                    bottom < lowest
                ) {

                    lowest =
                        bottom;

                }

            }

        }

    }


    return lowest;

}


/* =========================================================
   MOVEMENT COLLISION
========================================================= */

function movePlayer(
    dx,
    dy,
    dz
) {

    if (
        dx !== 0
    ) {

        const newX =
            player.position.x +
            dx;


        if (
            !collidesAt(

                newX,

                player.position.y,

                player.position.z

            )
        ) {

            player.position.x =
                newX;

        }

    }


    if (
        dz !== 0
    ) {

        const newZ =
            player.position.z +
            dz;


        if (
            !collidesAt(

                player.position.x,

                player.position.y,

                newZ

            )
        ) {

            player.position.z =
                newZ;

        }

    }


    if (
        dy !== 0
    ) {

        const newY =
            player.position.y +
            dy;


        if (
            !collidesAt(

                player.position.x,

                newY,

                player.position.z

            )
        ) {

            player.position.y =
                newY;

            player.onGround =
                false;

        } else {

            if (
                dy < 0
            ) {

                const ground =
                    findGroundHeight(

                        player.position.x,

                        player.position.z,

                        player.position.y

                    );


                if (
                    ground !== null
                ) {

                    player.position.y =
                        ground;

                }


                player.onGround =
                    true;


                /*
                    Fall damage.
                */

                if (
                    fallStartY !== null
                ) {

                    const distance =
                        fallStartY -
                        player.position.y;


                    if (
                        distance >
                        FALL_DAMAGE_START
                    ) {

                        const damage =
                            Math.floor(

                                (
                                    distance -
                                    FALL_DAMAGE_START

                                ) *

                                FALL_DAMAGE_PER_BLOCK

                            );


                        damagePlayer(
                            damage
                        );

                    }

                }


                fallStartY =
                    null;

            } else {

                const ceiling =
                    findCeilingHeight(

                        player.position.x,

                        player.position.z,

                        player.position.y

                    );


                if (
                    ceiling !== null
                ) {

                    player.position.y =

                        ceiling -
                        PLAYER_HEIGHT;

                }


                player.onGround =
                    false;

            }


            player.velocity.y =
                0;

        }

    }

}

========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );


startScreen.addEventListener(
    "click",
    () => {

        renderer.domElement
            .requestPointerLock();

    }

        if (
            document.pointerLockElement ===

        ) {

        ) {

/* =========================================================
   MOUSE LOOK
========================================================= */

document.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }


        const sensitivity =
            0.0025;


        player.yaw -=

            event.movementX *
            sensitivity;


        player.pitch -=

            event.movementY *
            sensitivity;


        const limit =
            Math.PI / 2 -
            0.05;


        player.pitch =

            Math.max(

                -limit,

                Math.min(

                    limit,

                    player.pitch

                )

            );

    }
);


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    delta
) {

    if (
        document.pointerLockElement !==
        renderer.domElement
    ) {

        return;

    }


    if (
        dead
    ) {

        return;

    }


    let forward = 0;

    let strafe = 0;


    /*
        W and S intentionally swapped.
    */

    if (
        keys["KeyW"]
    ) {

        forward -= 1;

    }


    if (
        keys["KeyS"]
    ) {

        forward += 1;

    }


    if (
        keys["KeyA"]
    ) {

        strafe -= 1;

    }


    if (
        keys["KeyD"]
    ) {

        strafe += 1;

    }


    if (
        forward === 0 &&
        strafe === 0
    ) {

        return;

    }


    const length =
        Math.sqrt(

            forward *
            forward +

            strafe *
            strafe

        );


    forward /=
        length;


    strafe /=
        length;


    const sin =
        Math.sin(
            player.yaw
        );


    const cos =
        Math.cos(
            player.yaw
        );


    /*
        Water slowdown.
    */

    const speed =

        isPlayerInWater()

            ?

        MOVE_SPEED *
        WATER_SPEED_MULTIPLIER

            :

        MOVE_SPEED;


    const moveX =

        (

            strafe * cos +

            forward * sin

        ) *

        speed *

        delta;


    const moveZ =

        (

            -strafe * sin +

            forward * cos

        ) *

        speed *

        delta;


    movePlayer(

        moveX,

        0,

        moveZ

    );

}


/* =========================================================
   PHYSICS
========================================================= */

function updatePhysics(
    delta
) {

    if (
        dead
    ) {

        return;

    }


    if (
        damageCooldown > 0
    ) {

        damageCooldown -=
            delta;

    }


    /*
        Start tracking a fall.
    */

    if (
        !player.onGround &&
        player.velocity.y < 0 &&
        fallStartY === null
    ) {

        fallStartY =
            player.position.y;

    }


    player.velocity.y -=

        GRAVITY *
        delta;


    movePlayer(

        0,

        player.velocity.y *
        delta,

        0

    );


    if (
        player.position.y <
        -20
    ) {

        damagePlayer(
            MAX_HEALTH
        );

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    camera.position.set(

        player.position.x,

        player.position.y +
        EYE_HEIGHT,

        player.position.z

    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =

    camera.rotation.x =

    camera.rotation.z =

}


/* =========================================================
   RAYCASTING
========================================================= */

const raycaster =
    new THREE.Raycaster();


raycaster.far =
    7;


const center =
    new THREE.Vector2(
        0,
        0
    );


function getTargetBlock() {

    raycaster.setFromCamera(

        center,

        camera

    );


    const objects = [];


    for (
        const chunk
        of loadedChunks.values()
    ) {

        if (
            chunk.mesh
        ) {

            objects.push(
                chunk.mesh
            );

        }

    }


    if (
        objects.length === 0
    ) {

        return null;

    }


    const hits =
        raycaster.intersectObjects(

            objects,

            false

        );


    if (
        hits.length === 0
    ) {

        return null;

    }


    const hit =
        hits[0];


    const geometry =
        hit.object.geometry;


    const triangle =
        hit.faceIndex;


    const block =
        geometry
            .userData
            .blockForTriangle[
                triangle
            ];


    if (!block) {

        return null;

    }


    return {

        hit,

        x: block.x,

        y: block.y,

        z: block.z

    };

}


/* =========================================================
   BREAK BLOCK
========================================================= */

function breakBlock() {

    const target =
        getTargetBlock();


    if (!target) {

        return;

    }


    const {
        x,
        y,
        z
    } = target;


    if (
        y < 0
    ) {

        return;

    }


    worldBlocks.delete(

        blockKey(
            x,
            y,
            z
        )

    );


    rebuildAffectedChunks(

        x,

        y,

        z

    );

}


/* =========================================================
   PLACE BLOCK
========================================================= */

function placeBlock() {

    const target =
        getTargetBlock();


    if (!target) {

        return;

    }


    const {
        hit,

        x,

        y,

        z

    } = target;


    /*
        Face normal tells us which
        neighboring block to place.
    */

    const normal =
        hit.face.normal.clone();


    const normalWorld =
        normal.transformDirection(

            hit.object.matrixWorld

        );


    const nx =
        Math.round(
            normalWorld.x
        );


    const ny =
        Math.round(
            normalWorld.y
        );


    const nz =
        Math.round(
            normalWorld.z
        );


    const placeX =
        x + nx;


    const placeY =
        y + ny;


    const placeZ =
        z + nz;


    if (
        placeY < 0 ||
        placeY >= WORLD_HEIGHT
    ) {

        return;

    }


    const type =
        BLOCKS[selectedSlot];


    if (
        isSolidBlock(type)
    ) {

        if (
            playerBoxOverlapsBlock(

                placeX,

                placeY,

                placeZ

            )
        ) {

            return;

        }

    }


    const key =
        blockKey(

            placeX,

            placeY,

            placeZ

        );


    if (
        worldBlocks.has(
            key
        )
    ) {

        return;

    }


    worldBlocks.set(

        key,

        type

    );


    rebuildAffectedChunks(

        placeX,

        placeY,

        placeZ

    );

}


/* =========================================================
   PLAYER / BLOCK OVERLAP
========================================================= */

function playerBoxOverlapsBlock(

    bx,

    by,

    bz

) {

    const halfWidth =
        PLAYER_WIDTH / 2;


    const pMinX =
        player.position.x -
        halfWidth;


    const pMaxX =
        player.position.x +
        halfWidth;


    const pMinY =
        player.position.y;


    const pMaxY =
        player.position.y +
        PLAYER_HEIGHT;


    const pMinZ =
        player.position.z -
        halfWidth;


    const pMaxZ =
        player.position.z +
        halfWidth;


    const bMinX =
        bx - 0.5;


    const bMaxX =
        bx + 0.5;


    const bMinY =
        by - 0.5;


    const bMaxY =
        by + 0.5;


    const bMinZ =
        bz - 0.5;


    const bMaxZ =
        bz + 0.5;


    return (

        pMaxX > bMinX &&

        pMinX < bMaxX &&

        pMaxY > bMinY &&

        pMinY < bMaxY &&

        pMaxZ > bMinZ &&

        pMinZ < bMaxZ

    );

}


/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousedown",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }


        if (
            dead
        ) {

            return;

        }


        if (
            event.button === 0
        ) {

            breakBlock();

        }


        if (
            event.button === 2
        ) {

            placeBlock();

        }

    }
);


window.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* =========================================================
   HOTBAR
========================================================= */

const hotbar =
    document.getElementById(
        "hotbar"
    );


let selectedSlot = 0;


function createHotbar() {

    hotbar.innerHTML = "";


    BLOCKS.forEach(

        (
            block,

            index

        ) => {

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot";


            if (
                index ===
                selectedSlot
            ) {

                slot.classList.add(
                    "selected"
                );

            }


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "slot-number";


            number.textContent =
                index + 1;


            const image =
                document.createElement(
                    "img"
                );


            image.src =

                TEXTURE_BASE +

                block +

                ".png";


            slot.appendChild(
                number
            );


            slot.appendChild(
                image
            );


            hotbar.appendChild(
                slot
            );

        }

    );

}


function updateHotbar() {

    const slots =
        document.querySelectorAll(
            ".slot"
        );


    slots.forEach(

        (
            slot,

            index

        ) => {

            slot.classList.toggle(

                "selected",

                index ===
                selectedSlot

            );

        }

    );

}


createHotbar();


/* =========================================================
   SPAWN
========================================================= */

function findSpawn() {

    const height =
        getTerrainHeight(
            0,
            0
        );


    player.position.set(

        0,

        height + 0.51,

        0

    );


    player.velocity.set(
        0,
        0,
        0
    );


    player.onGround =
        false;


    fallStartY =
        null;

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);


/* =========================================================
   WORLD UPDATE
========================================================= */

let lastChunkX = null;

let lastChunkZ = null;


function updateWorldIfNeeded() {

    const cx =
        worldToChunk(
            player.position.x
        );


    const cz =
        worldToChunk(
            player.position.z
        );


    if (

        cx !== lastChunkX ||

        cz !== lastChunkZ

    ) {

        lastChunkX =
            cx;


        lastChunkZ =
            cz;


        updateChunks();

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    let delta =

        (now - lastTime) /
        1000;


    lastTime =
        now;


    delta =
        Math.min(
            delta,
            0.05
        );


    updateMovement(
        delta
    );


    updatePhysics(
        delta
    );


    updateCamera();


    updateWorldIfNeeded();


    renderer.render(

        scene,

        camera

    );

}


/* =========================================================
   START
========================================================= */

updateHealthUI();


findSpawn();


/*
    Generate the initial world
    and build its chunks.
*/

updateChunks();


updateCamera();


document.getElementById(
    "loading"
).style.display =
    "none";


animate();


</script>
