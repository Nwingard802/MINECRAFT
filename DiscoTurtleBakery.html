<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rough Minecraft 3D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87ceeb;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 18px;
            height: 18px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: white;
            box-shadow: 0 0 2px black;
        }

        #crosshair::before {
            width: 2px;
            height: 18px;
            left: 8px;
            top: 0;
        }

        #crosshair::after {
            width: 18px;
            height: 2px;
            left: 0;
            top: 8px;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 10px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.5;
            z-index: 10;
            user-select: none;
            pointer-events: none;
        }

        #hotbar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 6px;
            z-index: 10;
            user-select: none;
        }

        .slot {
            position: relative;
            width: 54px;
            height: 54px;
            border: 3px solid #555;
            background: rgba(30, 30, 30, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.08s;
        }

        .slot.selected {
            border-color: white;
            box-shadow:
                0 0 0 2px black,
                0 0 10px white;
        }

        .slot-number {
            position: absolute;
            top: 2px;
            left: 4px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        .slot img {
            width: 38px;
            height: 38px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            object-fit: cover;
        }

        .slot-name {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 10px;
            white-space: nowrap;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #87ceeb;
            color: white;
            font-size: 28px;
            font-weight: bold;
            z-index: 100;
            text-shadow: 2px 2px 3px black;
        }
    </style>
</head>

<body>

    <div id="loading">
        Loading world...
    </div>

    <div id="crosshair"></div>

    <div id="info">
        WASD = Move<br>
        Space = Jump<br>
        Mouse = Look<br>
        Left Click = Break<br>
        Right Click = Place<br>
        1–9 = Select Block
    </div>

    <div id="hotbar"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        // ============================================================
        // GITHUB TEXTURES
        // ============================================================

        const TEXTURE_BASE =
            "https://raw.githubusercontent.com/Nwingard802/MINECRAFT/main/MINECRAFT-IMAGES/";


        // ============================================================
        // BLOCK TYPES
        // ============================================================

        const blockTypes = [
            "grass",
            "dirt",
            "stone",
            "sand",
            "wood",
            "leaves",
            "brick",
            "glass",
            "cobblestone"
        ];


        // ============================================================
        // THREE.JS SETUP
        // ============================================================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x87ceeb);

        scene.fog = new THREE.Fog(
            0x87ceeb,
            25,
            45
        );


        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.05,
            1000
        );


        const renderer = new THREE.WebGLRenderer({
            antialias: false
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 1.5)
        );

        document.body.appendChild(renderer.domElement);


        // ============================================================
        // LIGHTING
        // ============================================================

        const ambientLight = new THREE.HemisphereLight(
            0xffffff,
            0x666666,
            1.8
        );

        scene.add(ambientLight);


        const sun = new THREE.DirectionalLight(
            0xffffff,
            1.2
        );

        sun.position.set(
            50,
            100,
            30
        );

        scene.add(sun);


        // ============================================================
        // TEXTURES
        // ============================================================

        const textureLoader = new THREE.TextureLoader();

        const textures = {};
        const materials = {};


        function loadBlockTexture(blockName) {
            const texture = textureLoader.load(
                TEXTURE_BASE + blockName + ".png",
                function () {
                    console.log(
                        "Loaded texture:",
                        blockName
                    );
                },
                undefined,
                function () {
                    console.warn(
                        "Could not load texture:",
                        blockName
                    );
                }
            );

            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;

            texture.colorSpace = THREE.SRGBColorSpace;

            return texture;
        }


        // Load all textures.

        for (const blockName of blockTypes) {
            textures[blockName] =
                loadBlockTexture(blockName);
        }


        // ============================================================
        // MATERIALS
        // ============================================================

        for (const blockName of blockTypes) {

            const isTransparent =
                blockName === "leaves" ||
                blockName === "glass";

            materials[blockName] =
                new THREE.MeshLambertMaterial({
                    map: textures[blockName],

                    transparent: isTransparent,

                    alphaTest:
                        blockName === "leaves"
                            ? 0.1
                            : 0,

                    side:
                        isTransparent
                            ? THREE.DoubleSide
                            : THREE.FrontSide,

                    depthWrite:
                        blockName === "glass"
                            ? false
                            : true
                });
        }


        // ============================================================
        // WORLD DATA
        // ============================================================

        const worldBlocks = new Map();

        const renderedBlocks = new Map();

        const generatedColumns = new Set();


        function blockKey(x, y, z) {
            return `${x},${y},${z}`;
        }


        function columnKey(x, z) {
            return `${x},${z}`;
        }


        // ============================================================
        // TERRAIN
        // ============================================================

        function getTerrainHeight(x, z) {

            const height =
                4 +
                Math.floor(
                    Math.sin(x * 0.18) * 2
                    +
                    Math.cos(z * 0.16) * 2
                    +
                    Math.sin(
                        (x + z) * 0.08
                    ) * 2
                );

            return Math.max(
                1,
                height
            );
        }


        // ============================================================
        // WORLD BLOCK DATA
        // ============================================================

        function setWorldBlock(
            x,
            y,
            z,
            type
        ) {
            worldBlocks.set(
                blockKey(x, y, z),
                type
            );
        }


        function getWorldBlock(
            x,
            y,
            z
        ) {
            return worldBlocks.get(
                blockKey(x, y, z)
            );
        }


        function deleteWorldBlock(
            x,
            y,
            z
        ) {
            worldBlocks.delete(
                blockKey(x, y, z)
            );
        }


        // ============================================================
        // CREATE TERRAIN COLUMN
        // ============================================================

        function generateColumn(x, z) {

            const key = columnKey(x, z);

            if (generatedColumns.has(key)) {
                return;
            }

            generatedColumns.add(key);

            const height =
                getTerrainHeight(x, z);


            for (
                let y = 0;
                y <= height;
                y++
            ) {

                let type;


                if (y === height) {

                    type = "grass";

                } else if (
                    y >= height - 2
                ) {

                    type = "dirt";

                } else if (
                    y <= 1
                ) {

                    type = "stone";

                } else {

                    type = "stone";
                }


                setWorldBlock(
                    x,
                    y,
                    z,
                    type
                );
            }
        }


        // ============================================================
        // BLOCK MESH
        // ============================================================

        const blockGeometry =
            new THREE.BoxGeometry(
                1,
                1,
                1
            );


        function createBlock(
            x,
            y,
            z,
            type
        ) {

            const key =
                blockKey(x, y, z);


            if (renderedBlocks.has(key)) {
                return;
            }


            const material =
                materials[type];


            if (!material) {
                console.warn(
                    "Missing material:",
                    type
                );

                return;
            }


            const mesh =
                new THREE.Mesh(
                    blockGeometry,
                    material
                );


            mesh.position.set(
                x,
                y,
                z
            );


            mesh.userData = {
                x: x,
                y: y,
                z: z,
                type: type
            };


            scene.add(mesh);

            renderedBlocks.set(
                key,
                mesh
            );
        }


        function removeRenderedBlock(
            x,
            y,
            z
        ) {

            const key =
                blockKey(x, y, z);


            const mesh =
                renderedBlocks.get(key);


            if (!mesh) {
                return;
            }


            scene.remove(mesh);

            renderedBlocks.delete(key);
        }


        // ============================================================
        // RENDER DISTANCE
        // ============================================================

        const RENDER_DISTANCE = 16;


        let lastPlayerBlockX = null;
        let lastPlayerBlockZ = null;


        function updateRenderDistance() {

            const centerX =
                Math.floor(player.position.x);

            const centerZ =
                Math.floor(player.position.z);


            if (
                centerX === lastPlayerBlockX &&
                centerZ === lastPlayerBlockZ
            ) {
                return;
            }


            lastPlayerBlockX = centerX;
            lastPlayerBlockZ = centerZ;


            // Generate new columns.

            for (
                let x = centerX - RENDER_DISTANCE;
                x <= centerX + RENDER_DISTANCE;
                x++
            ) {

                for (
                    let z = centerZ - RENDER_DISTANCE;
                    z <= centerZ + RENDER_DISTANCE;
                    z++
                ) {

                    generateColumn(x, z);
                }
            }


            // Render world blocks within range.

            for (
                const [
                    key,
                    type
                ] of worldBlocks
            ) {

                const parts =
                    key.split(",");

                const x =
                    Number(parts[0]);

                const y =
                    Number(parts[1]);

                const z =
                    Number(parts[2]);


                if (
                    Math.abs(
                        x - centerX
                    ) <= RENDER_DISTANCE &&
                    Math.abs(
                        z - centerZ
                    ) <= RENDER_DISTANCE
                ) {

                    createBlock(
                        x,
                        y,
                        z,
                        type
                    );

                } else {

                    removeRenderedBlock(
                        x,
                        y,
                        z
                    );
                }
            }
        }


        // ============================================================
        // PLAYER
        // ============================================================

        const player = {

            position: new THREE.Vector3(
                0,
                12,
                0
            ),

            velocity: new THREE.Vector3(
                0,
                0,
                0
            ),

            height: 1.8,

            width: 0.6,

            onGround: false
        };


        camera.position.copy(
            player.position
        );


        // ============================================================
        // PLAYER LOOK
        // ============================================================

        let yaw = 0;
        let pitch = 0;

        let pointerLocked = false;


        renderer.domElement.addEventListener(
            "click",
            function () {

                renderer.domElement.requestPointerLock();
            }
        );


        document.addEventListener(
            "pointerlockchange",
            function () {

                pointerLocked =
                    document.pointerLockElement ===
                    renderer.domElement;
            }
        );


        document.addEventListener(
            "mousemove",
            function (event) {

                if (!pointerLocked) {
                    return;
                }


                yaw -=
                    event.movementX *
                    0.002;


                pitch -=
                    event.movementY *
                    0.002;


                const limit =
                    Math.PI / 2 - 0.01;


                pitch =
                    Math.max(
                        -limit,
                        Math.min(
                            limit,
                            pitch
                        )
                    );
            }
        );


        // ============================================================
        // INPUT
        // ============================================================

        const keys = {};


        document.addEventListener(
            "keydown",
            function (event) {

                keys[event.code] = true;


                // Number keys 1-9.

                if (
                    event.code.startsWith("Digit")
                ) {

                    const number =
                        Number(
                            event.code.replace(
                                "Digit",
                                ""
                            )
                        );


                    if (
                        number >= 1 &&
                        number <= 9
                    ) {

                        selectedBlock =
                            number - 1;

                        updateHotbar();
                    }
                }


                if (
                    event.code ===
                    "Space"
                ) {

                    event.preventDefault();

                    if (
                        player.onGround
                    ) {

                        player.velocity.y =
                            7;
                    }
                }
            }
        );


        document.addEventListener(
            "keyup",
            function (event) {

                keys[event.code] = false;
            }
        );


        // ============================================================
        // COLLISION
        // ============================================================

        function isSolidAt(
            x,
            y,
            z
        ) {

            const type =
                getWorldBlock(
                    Math.floor(x),
                    Math.floor(y),
                    Math.floor(z)
                );


            return (
                type !== undefined
            );
        }


        function collides(
            position
        ) {

            const halfWidth =
                player.width / 2;


            const minX =
                position.x -
                halfWidth;

            const maxX =
                position.x +
                halfWidth;


            const minY =
                position.y;

            const maxY =
                position.y +
                player.height;


            const minZ =
                position.z -
                halfWidth;

            const maxZ =
                position.z +
                halfWidth;


            for (
                let x =
                    Math.floor(minX);
                x <= Math.floor(maxX);
                x++
            ) {

                for (
                    let y =
                        Math.floor(minY);
                    y <= Math.floor(maxY);
                    y++
                ) {

                    for (
                        let z =
                            Math.floor(minZ);
                        z <= Math.floor(maxZ);
                        z++
                    ) {

                        if (
                            isSolidAt(
                                x,
                                y,
                                z
                            )
                        ) {

                            return true;
                        }
                    }
                }
            }


            return false;
        }


        // ============================================================
        // MOVEMENT
        // ============================================================

        function updatePlayer(
            delta
        ) {

            const speed = 5;


            let moveX = 0;
            let moveZ = 0;


            // W = BACKWARD
            // S = FORWARD

            if (keys["KeyW"]) {
                moveZ += 1;
            }

            if (keys["KeyS"]) {
                moveZ -= 1;
            }

            if (keys["KeyA"]) {
                moveX -= 1;
            }

            if (keys["KeyD"]) {
                moveX += 1;
            }


            const length =
                Math.sqrt(
                    moveX * moveX +
                    moveZ * moveZ
                );


            if (length > 0) {

                moveX /= length;
                moveZ /= length;
            }


            // Rotate movement based on camera yaw.

            const sin =
                Math.sin(yaw);

            const cos =
                Math.cos(yaw);


            const worldX =
                moveX * cos -
                moveZ * sin;


            const worldZ =
                moveX * sin +
                moveZ * cos;


            const moveAmount =
                speed * delta;


            // X collision.

            const newX =
                player.position.x +
                worldX * moveAmount;


            const testX =
                player.position.clone();

            testX.x = newX;


            if (
                !collides(testX)
            ) {

                player.position.x =
                    newX;
            }


            // Z collision.

            const newZ =
                player.position.z +
                worldZ * moveAmount;


            const testZ =
                player.position.clone();

            testZ.z = newZ;


            if (
                !collides(testZ)
            ) {

                player.position.z =
                    newZ;
            }


            // Gravity.

            player.velocity.y -=
                20 * delta;


            const newY =
                player.position.y +
                player.velocity.y *
                delta;


            const testY =
                player.position.clone();

            testY.y = newY;


            if (
                !collides(testY)
            ) {

                player.position.y =
                    newY;

                player.onGround =
                    false;

            } else {

                if (
                    player.velocity.y < 0
                ) {

                    player.onGround =
                        true;
                }

                player.velocity.y =
                    0;
            }


            // Prevent falling forever.

            if (
                player.position.y < -20
            ) {

                player.position.set(
                    0,
                    15,
                    0
                );

                player.velocity.set(
                    0,
                    0,
                    0
                );
            }
        }


        // ============================================================
        // CAMERA
        // ============================================================

        function updateCamera() {

            camera.position.set(
                player.position.x,
                player.position.y +
                    player.height * 0.85,
                player.position.z
            );


            camera.rotation.order =
                "YXZ";


            camera.rotation.y =
                yaw;

            camera.rotation.x =
                pitch;
        }


        // ============================================================
        // BLOCK BREAKING / PLACING
        // ============================================================

        const raycaster =
            new THREE.Raycaster();


        const mouse =
            new THREE.Vector2(
                0,
                0
            );


        let selectedBlock = 0;


        // Prevent browser context menu.

        document.addEventListener(
            "contextmenu",
            function (event) {

                event.preventDefault();
            }
        );


        document.addEventListener(
            "mousedown",
            function (event) {

                if (!pointerLocked) {
                    return;
                }


                if (
                    event.button === 0
                ) {

                    breakBlock();

                } else if (
                    event.button === 2
                ) {

                    placeBlock();
                }
            }
        );


        function getTargetBlock() {

            raycaster.setFromCamera(
                mouse,
                camera
            );


            const objects =
                Array.from(
                    renderedBlocks.values()
                );


            const hits =
                raycaster.intersectObjects(
                    objects,
                    false
                );


            if (
                hits.length === 0
            ) {

                return null;
            }


            return hits[0];
        }


        function breakBlock() {

            const hit =
                getTargetBlock();


            if (!hit) {
                return;
            }


            const mesh =
                hit.object;


            const {
                x,
                y,
                z
            } = mesh.userData;


            // Don't break the block
            // directly underneath the player.

            const blockTop =
                y + 1;


            const playerBottom =
                player.position.y;


            if (
                blockTop >
                    playerBottom &&
                y <
                    player.position.y +
                    player.height
            ) {

                // Still allow breaking,
                // unless it causes immediate
                // weird collision.
            }


            deleteWorldBlock(
                x,
                y,
                z
            );


            removeRenderedBlock(
                x,
                y,
                z
            );
        }


        function placeBlock() {

            const hit =
                getTargetBlock();


            if (!hit) {
                return;
            }


            const mesh =
                hit.object;


            const {
                x,
                y,
                z
            } = mesh.userData;


            const normal =
                hit.face.normal;


            const placeX =
                x +
                Math.round(
                    normal.x
                );


            const placeY =
                y +
                Math.round(
                    normal.y
                );


            const placeZ =
                z +
                Math.round(
                    normal.z
                );


            // Don't place inside player.

            const blockCenter =
                new THREE.Vector3(
                    placeX,
                    placeY,
                    placeZ
                );


            const playerCenter =
                new THREE.Vector3(
                    player.position.x,
                    player.position.y +
                        player.height / 2,
                    player.position.z
                );


            const distance =
                blockCenter.distanceTo(
                    playerCenter
                );


            if (
                distance < 1.5
            ) {

                return;
            }


            if (
                getWorldBlock(
                    placeX,
                    placeY,
                    placeZ
                ) !== undefined
            ) {

                return;
            }


            const type =
                blockTypes[
                    selectedBlock
                ];


            setWorldBlock(
                placeX,
                placeY,
                placeZ,
                type
            );


            createBlock(
                placeX,
                placeY,
                placeZ,
                type
            );
        }


        // ============================================================
        // HOTBAR
        // ============================================================

        const hotbar =
            document.getElementById(
                "hotbar"
            );


        function updateHotbar() {

            hotbar.innerHTML = "";


            blockTypes.forEach(
                (
                    blockName,
                    index
                ) => {

                    const slot =
                        document.createElement(
                            "div"
                        );


                    slot.className =
                        "slot";


                    if (
                        index ===
                        selectedBlock
                    ) {

                        slot.classList.add(
                            "selected"
                        );
                    }


                    const number =
                        document.createElement(
                            "div"
                        );


                    number.className =
                        "slot-number";


                    number.textContent =
                        index + 1;


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        TEXTURE_BASE +
                        blockName +
                        ".png";


                    image.alt =
                        blockName;


                    image.onerror =
                        function () {

                            this.style.display =
                                "none";
                        };


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "slot-name";


                    name.textContent =
                        blockName;


                    slot.appendChild(
                        number
                    );

                    slot.appendChild(
                        image
                    );

                    slot.appendChild(
                        name
                    );


                    slot.addEventListener(
                        "click",
                        function () {

                            selectedBlock =
                                index;

                            updateHotbar();
                        }
                    );


                    hotbar.appendChild(
                        slot
                    );
                }
            );
        }


        updateHotbar();


        // ============================================================
        // INITIAL WORLD
        // ============================================================

        generateColumn(
            0,
            0
        );


        // Generate initial area.

        for (
            let x = -RENDER_DISTANCE;
            x <= RENDER_DISTANCE;
            x++
        ) {

            for (
                let z = -RENDER_DISTANCE;
                z <= RENDER_DISTANCE;
                z++
            ) {

                generateColumn(
                    x,
                    z
                );
            }
        }


        // Render initial world.

        updateRenderDistance();


        // ============================================================
        // GAME LOOP
        // ============================================================

        let lastTime =
            performance.now();


        function animate() {

            requestAnimationFrame(
                animate
            );


            const now =
                performance.now();


            let delta =
                (now - lastTime) /
                1000;


            lastTime = now;


            // Prevent huge physics jumps.

            delta =
                Math.min(
                    delta,
                    0.05
                );


            updatePlayer(
                delta
            );


            updateCamera();


            updateRenderDistance();


            renderer.render(
                scene,
                camera
            );
        }


        animate();


        // ============================================================
        // RESIZE
        // ============================================================

        window.addEventListener(
            "resize",
            function () {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );


        // ============================================================
        // REMOVE LOADING SCREEN
        // ============================================================

        setTimeout(
            function () {

                const loading =
                    document.getElementById(
                        "loading"
                    );


                loading.style.display =
                    "none";

            },
            1000
        );
    </script>

</body>
</html>
